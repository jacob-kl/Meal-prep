<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake & Laine — Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Barlow',sans-serif; font-weight:300; min-height:100vh; transition:background 0.3s,color 0.3s; }
body.light { background:#f5f0e8; color:#2a2418; }
body.dark  { background:#1a1710; color:#e8e0d0; }
button { font-family:'Barlow',sans-serif; cursor:pointer; }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:var(--scroll-track); }
::-webkit-scrollbar-thumb { background:#b8a88a; border-radius:3px; }
::selection { background:#f0e0b8; }
@keyframes wave1 { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
@keyframes wave2 { 0%{transform:translateX(0)} 100%{transform:translateX(50%)} }
@keyframes fillRise { from{height:0} to{height:var(--fh)} }
</style>
</head>
<body class="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useContext, createContext, useCallback, useRef } = React;
 
// ── Config ────────────────────────────────────────────────────────────
const WEEK_REGISTRY = [
  { id:"2026-W19", label:"Week of May 4, 2026" },
  { id:"2026-W20", label:"Week of May 11, 2026" },
  { id:"2026-W21", label:"Week of May 18, 2026" },
  { id:"2026-W22", label:"Week of May 25, 2026" },
  { id:"2026-W23", label:"Week of June 1, 2026" },
];
const CURRENT_WEEK_ID = "2026-W23";
const WATER_GLASSES   = 8;
const WATER_OZ_EACH   = 16;
const WATER_TOTAL_OZ  = 128;
const WATER_KEY       = "jl_water";
const RATINGS_KEY     = "jl_ratings";
const DARK_KEY        = "jl_dark";
 
// ── Context ───────────────────────────────────────────────────────────
const SubsCtx    = createContext({ subs:{}, setSub:()=>{} });
const useSubs    = () => useContext(SubsCtx);
const DropCtx    = createContext({ openKey:null, setOpenKey:()=>{} });
const useDrop    = () => useContext(DropCtx);
const NutCtx     = createContext({});
const useNut     = () => useContext(NutCtx);
const DarkCtx    = createContext(false);
const useDark    = () => useContext(DarkCtx);
 
// ── Theme ─────────────────────────────────────────────────────────────
function getT(dark) {
  return dark ? {
    bg:"#1a1710", card:"#252218", border:"#3a3428",
    accent:"#d4765a", accentSoft:"#2e1f18",
    gold:"#c4a86e", goldSoft:"#231e14",
    green:"#5a9e6a", greenSoft:"#162018",
    blue:"#5a8eb0", blueSoft:"#131e28",
    text:"#e8e0d0", textMid:"#b8a888", textLight:"#7a6a58",
    divider:"#3a3428", tag:"#2a2418", tagBorder:"#4a3e2c",
    inputBg:"#2a2418",
  } : {
    bg:"#f5f0e8", card:"#ffffff", border:"#e8dfc8",
    accent:"#7a3e2e", accentSoft:"#f5ede0",
    gold:"#c4a86e", goldSoft:"#fdf4e3",
    green:"#3a6b4a", greenSoft:"#edf5ed",
    blue:"#2e5a7a", blueSoft:"#eef3f7",
    text:"#2a2418", textMid:"#6a5a48", textLight:"#9a8a6e",
    divider:"#e8dfc8", tag:"#f5f0e8", tagBorder:"#e0d5c0",
    inputBg:"#faf7f2",
  };
}
 
const CLR = { cal:"#c8814a", protein:"#6b9e6b", carbs:"#c8a96a", fat:"#7a9ec0", fiber:"#9e7ab5" };
const MICRO_CLR = {
  sodium:"#e07040", potassium:"#6b9e6b", calcium:"#c8a96a", vitamin_d:"#e8c040",
  magnesium:"#7ab0c0", zinc:"#a07ab0", vitamin_c:"#e8804a", vitamin_b12:"#6ab08a",
  iron:"#c05050", vitamin_a:"#e0a030", folate:"#70a870", phosphorus:"#8090c0", selenium:"#b08060",
  fiber:"#9e7ab5"
};
 
// ── Water helpers ─────────────────────────────────────────────────────
function getTodayKey() { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function loadWater() {
  try { const r=JSON.parse(localStorage.getItem(WATER_KEY)||"{}"); if(r.date!==getTodayKey()) return Array(WATER_GLASSES).fill(true); return r.glasses; }
  catch { return Array(WATER_GLASSES).fill(true); }
}
function saveWater(g) { localStorage.setItem(WATER_KEY,JSON.stringify({date:getTodayKey(),glasses:g})); }
 
// ── Rating helpers ────────────────────────────────────────────────────
function loadRatings() { try{return JSON.parse(localStorage.getItem(RATINGS_KEY)||"{}");}catch{return {};} }
function saveRatings(r) { localStorage.setItem(RATINGS_KEY,JSON.stringify(r)); }
const RATING_LABELS = {
  0:"Hard pass",1:"Not our thing",2:"Wouldn't make again",3:"Missing something",
  4:"It'll do",5:"Solid middle ground",6:"Genuinely enjoyed it",7:"Would request this again",
  8:"Really hit the spot",9:"Borderline perfect",10:"Make this every week!"
};
const SUBMIT_BTNS = [
  "🫒 That's a keeper","🍋 Squeeze it in","🧑‍🍳 Chef's kiss — save it",
  "🦐 Reel it in","🥗 Toss & save","🫙 Jar that rating",
  "🌿 Fresh take — saved","🍳 Plate it","🧄 Lock it in","🥂 Done — saved",
];
 
// ── Rating Slider ─────────────────────────────────────────────────────
function MealRating({ mealKey }) {
  const T = getT(useDark());
  const [ratings, setRatings] = useState(loadRatings);
  const [pending, setPending] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [showSaved, setShowSaved] = useState(false);
  const [btn] = useState(()=>SUBMIT_BTNS[Math.floor(Math.random()*SUBMIT_BTNS.length)]);
  const trackRef = useRef(null);
  const timerRef = useRef(null);
  const saved = ratings[mealKey];
  const draft = pending!=null ? pending : saved;
  const isChanged = pending!=null && pending!==saved;
 
  const valFromE = e => {
    if(!trackRef.current) return 0;
    const r = trackRef.current.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    return Math.round(Math.max(0,Math.min(1,(cx-r.left)/r.width))*10);
  };
  const onStart = e => { setDragging(true); setPending(valFromE(e)); };
  const onMove  = e => { if(!dragging) return; e.preventDefault(); setPending(valFromE(e)); };
  const onEnd   = () => setDragging(false);
  const commit  = () => {
    if(pending==null) return;
    const next={...loadRatings(),[mealKey]:pending};
    saveRatings(next); setRatings(next); setPending(null);
    clearTimeout(timerRef.current);
    setShowSaved(true); timerRef.current=setTimeout(()=>setShowSaved(false),2200);
  };
  const ratingClr = v => v==null?T.textLight:v<=3?"#c05050":v<=6?T.gold:T.green;
 
  return (
    <div style={{marginTop:14,paddingTop:12,borderTop:`1px solid ${T.divider}`}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <span style={{fontSize:11,color:T.textLight,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",textTransform:"uppercase"}}>Rate this meal</span>
        <span style={{fontSize:11,fontWeight:500,color:showSaved?T.green:ratingClr(draft??null),transition:"color 0.2s",fontStyle:draft==null?"italic":"normal"}}>
          {showSaved?"✓ saved!":draft!=null?`${draft}/10 — ${RATING_LABELS[draft]}`:"drag to score"}
        </span>
      </div>
      <div ref={trackRef} style={{position:"relative",height:36,cursor:"ew-resize",userSelect:"none",touchAction:"none"}}
        onMouseDown={onStart} onMouseMove={onMove} onMouseUp={onEnd} onMouseLeave={onEnd}
        onTouchStart={onStart} onTouchMove={onMove} onTouchEnd={onEnd}>
        <div style={{position:"absolute",top:"50%",left:0,right:0,height:6,transform:"translateY(-50%)",background:T.divider,borderRadius:3}}>
          {draft!=null&&<div style={{height:"100%",width:`${(draft/10)*100}%`,background:`linear-gradient(to right,#c05050,${T.gold},${T.green})`,borderRadius:3,opacity:isChanged?0.6:1,transition:dragging?"none":"width 0.1s"}}/>}
        </div>
        {Array.from({length:11},(_,i)=>(
          <div key={i} style={{position:"absolute",top:"50%",left:`${(i/10)*100}%`,transform:"translate(-50%,-50%)",width:i===0||i===10?3:2,height:i===0||i===10?12:7,background:T.divider,borderRadius:1}}/>
        ))}
        {draft!=null
          ?<div style={{position:"absolute",top:"50%",left:`${(draft/10)*100}%`,transform:"translate(-50%,-50%)",width:22,height:22,borderRadius:"50%",background:isChanged?"#e8c87a":ratingClr(draft),border:"2px solid white",boxShadow:"0 2px 8px rgba(0,0,0,0.2)",transition:dragging?"none":"left 0.1s,background 0.2s",zIndex:2,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:9,fontWeight:700,color:"white",fontFamily:"monospace"}}>{draft}</span>
            </div>
          :<div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:22,height:22,borderRadius:"50%",background:T.divider,border:`2px dashed ${T.textLight}`,zIndex:2}}/>
        }
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:2,marginBottom:10}}>
        <span style={{fontSize:9,color:T.textLight,fontFamily:"monospace"}}>0</span>
        <span style={{fontSize:9,color:T.textLight,fontFamily:"monospace"}}>10</span>
      </div>
      <div style={{overflow:"hidden",maxHeight:isChanged?48:0,opacity:isChanged?1:0,transition:"max-height 0.25s ease,opacity 0.2s ease"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:10}}>
          <button onClick={()=>setPending(saved??null)} style={{background:"none",border:"none",fontSize:11,color:T.textLight,padding:"4px 8px"}}>Cancel</button>
          <button onClick={commit} style={{background:T.accentSoft,border:`1px solid ${T.accent}`,borderRadius:20,padding:"7px 16px",fontSize:12,fontWeight:500,color:T.accent}}>
            {btn}
          </button>
        </div>
      </div>
      {saved!=null&&!isChanged&&!showSaved&&(
        <div style={{display:"flex",justifyContent:"flex-end"}}>
          <button onClick={()=>setPending(saved)} style={{background:"none",border:"none",fontSize:10,color:T.textLight,padding:0,textDecoration:"underline"}}>edit rating</button>
        </div>
      )}
    </div>
  );
}
 
// ── Water Tracker ─────────────────────────────────────────────────────
function WaterGlass({ full, onClick, index }) {
  const T = getT(useDark());
  const W=32,H=44;
  return (
    <button onClick={onClick} title={full?`Tap when you drink glass ${index+1}`:"Tap to undo"}
      style={{background:"none",border:"none",padding:4,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none">
        <clipPath id={`gc${index}`}><path d={`M5 3 L${W-5} 3 L${W-6.5} ${H-3} L6.5 ${H-3} Z`}/></clipPath>
        <rect x="0" y={full?6:H+2} width={W} height={H} fill="#7ab8d8" fillOpacity="0.85" clipPath={`url(#gc${index})`} style={{transition:"y 0.35s cubic-bezier(.4,0,.2,1)"}}/>
        {full&&<line x1="7" y1="10" x2={W-7} y2="10" stroke="#a8d4ea" strokeWidth="1" strokeOpacity="0.6"/>}
        <path d={`M4 3 L${W-4} 3 L${W-6} ${H-3} L6 ${H-3} Z`} fill="none" stroke={full?"#5a9ec0":T.text} strokeWidth={full?1.5:2} strokeLinejoin="round"/>
        {!full&&<text x={W/2} y={H/2+5} textAnchor="middle" fontSize="12" fill={T.text} fontWeight="bold">✓</text>}
      </svg>
      <span style={{fontSize:8,color:full?"#2e5a7a":T.textMid,fontFamily:"monospace"}}>{(index+1)*WATER_OZ_EACH}oz</span>
    </button>
  );
}
function WaterTracker() {
  const T = getT(useDark());
  const [glasses, setGlasses] = useState(loadWater);
  useEffect(()=>{
    const ms=()=>{const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);return m-n;};
    const t=setTimeout(()=>{const f=Array(WATER_GLASSES).fill(true);setGlasses(f);saveWater(f);},ms());
    return ()=>clearTimeout(t);
  },[glasses]);
  const toggle = i => setGlasses(prev=>{const n=[...prev];n[i]=!n[i];saveWater(n);return n;});
  const drunk=glasses.filter(g=>!g).length;
  const ozDone=drunk*WATER_OZ_EACH;
  const allDone=drunk===WATER_GLASSES;
  const pct=(ozDone/WATER_TOTAL_OZ)*100;
  return (
    <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"16px 20px",marginBottom:24}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:12}}>
        <div>
          <div style={{fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",color:"#2e5a7a",fontFamily:"'DM Mono',monospace",marginBottom:3}}>Water Today</div>
          <div style={{fontSize:13,fontFamily:"'Lora',serif",color:T.text}}>
            {allDone?"✓ Full gallon — nice.":`${ozDone}oz of ${WATER_TOTAL_OZ}oz · ${WATER_TOTAL_OZ-ozDone}oz to go`}
          </div>
        </div>
        <span style={{fontSize:10,color:T.textLight,fontFamily:"'DM Mono',monospace",textAlign:"right",lineHeight:1.6}}>Tap when<br/>you drink it</span>
      </div>
      <div style={{height:4,background:T.divider,borderRadius:3,marginBottom:14,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(to right,#7ab8d8,#2e5a7a)",borderRadius:3,transition:"width 0.4s cubic-bezier(.4,0,.2,1)"}}/>
      </div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
        {glasses.map((full,i)=><WaterGlass key={i} index={i} full={full} onClick={()=>toggle(i)}/>)}
      </div>
      {drunk>0&&!allDone&&(
        <button onClick={()=>{const f=Array(WATER_GLASSES).fill(true);setGlasses(f);saveWater(f);}} style={{marginTop:8,background:"none",border:"none",fontSize:10,color:T.textLight,padding:0}}>↺ Reset</button>
      )}
    </div>
  );
}
 
// ── Macro Water-Level Cells ───────────────────────────────────────────
function WaterCell({ label, value, unit, pct, color, bg, dark }) {
  const clamp = Math.min(Math.max(pct,0),100);
  const wc = color+"55", wc2 = color+"33";
  const [anim, setAnim] = useState(false);
  useEffect(()=>{const t=setTimeout(()=>setAnim(true),80);return()=>clearTimeout(t);},[pct]);
  return (
    <div style={{position:"relative",overflow:"hidden",background:bg,borderRadius:10,height:88}}>
      {/* Water fill */}
      <div style={{position:"absolute",bottom:0,left:0,right:0,height:anim?`${clamp}%`:"0%",transition:"height 1.1s cubic-bezier(.4,0,.2,1)"}}>
        {/* Wave */}
        <div style={{position:"absolute",top:-8,left:0,width:"200%",height:14}}>
          <svg viewBox="0 0 200 14" width="100%" height="14" preserveAspectRatio="none" style={{display:"block",animation:"wave1 2.8s linear infinite"}}>
            <path d="M0 7 C25 1,50 13,75 7 S125 1,150 7 S175 13,200 7 L200 14 L0 14 Z" fill={wc}/>
          </svg>
          <svg viewBox="0 0 200 14" width="100%" height="14" preserveAspectRatio="none" style={{display:"block",position:"absolute",top:0,left:0,animation:"wave2 3.6s linear infinite",opacity:0.5}}>
            <path d="M0 7 C30 13,60 1,90 7 S140 13,170 7 S185 1,200 7 L200 14 L0 14 Z" fill={wc2}/>
          </svg>
        </div>
        <div style={{position:"absolute",inset:0,top:14,background:color+"18"}}/>
      </div>
      {/* Content */}
      <div style={{position:"relative",zIndex:2,padding:"12px 14px",height:"100%",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
        <div style={{fontSize:9,fontFamily:"'DM Mono',monospace",textTransform:"uppercase",letterSpacing:"0.12em",color:color,opacity:0.85}}>{label}</div>
        <div style={{display:"flex",alignItems:"baseline",gap:3}}>
          <span style={{fontSize:24,fontFamily:"'Lora',serif",color,fontWeight:500,lineHeight:1}}>{value}</span>
          <span style={{fontSize:10,color:color,opacity:0.6,fontFamily:"'DM Mono',monospace"}}>{unit}</span>
        </div>
        <div style={{height:2,background:"rgba(0,0,0,0.08)",borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${clamp}%`,background:color,borderRadius:2,transition:"width 1.1s cubic-bezier(.4,0,.2,1)"}}/>
        </div>
      </div>
    </div>
  );
}
 
// ── Sub Dropdown ──────────────────────────────────────────────────────
function SubDropdown({ ing }) {
  const T = getT(useDark());
  const { subs, setSub } = useSubs();
  const { openKey, setOpenKey } = useDrop();
  const ref = useRef(null);
  const isOpen = openKey===ing.subKey;
  const cur = subs[ing.subKey]||"default";
  const [ms, setMs] = useState({});
  const toggle = () => {
    if(!isOpen&&ref.current){const r=ref.current.getBoundingClientRect();const below=window.innerHeight-r.bottom;const mh=Math.min(280,44+ing.substitutions.length*52);setMs({top:Math.max(8,below>mh?r.bottom+6:r.top-mh-6),left:Math.min(r.left,window.innerWidth-230)});}
    setOpenKey(isOpen?null:ing.subKey);
  };
  return (
    <div style={{display:"inline-block"}}>
      <button ref={ref} onClick={toggle} style={{background:"none",border:`1px solid ${T.border}`,borderRadius:5,color:T.textLight,padding:"1px 7px",fontSize:10,marginLeft:6}}>{isOpen?"▲":"▼"} swap</button>
      {isOpen&&(
        <div style={{position:"fixed",...ms,zIndex:1000,background:T.card,border:`1px solid ${T.gold}`,borderRadius:12,padding:6,width:220,boxShadow:"0 8px 32px rgba(0,0,0,0.18)"}}>
          <div onClick={()=>{setSub(ing.subKey,null);setOpenKey(null);}} style={{padding:"9px 12px",fontSize:12,cursor:"pointer",borderRadius:8,color:cur==="default"?T.green:T.textMid,background:cur==="default"?T.greenSoft:"none"}}>
            {ing.item} <span style={{color:T.textLight,fontSize:10}}>(original)</span>
          </div>
          {ing.substitutions.map(s=>(
            <div key={s.id} onClick={()=>{setSub(ing.subKey,s.id);setOpenKey(null);}} style={{padding:"9px 12px",fontSize:12,cursor:"pointer",borderRadius:8,color:cur===s.id?T.green:T.textMid,background:cur===s.id?T.greenSoft:"none"}}>
              {s.item}{s.note&&<div style={{fontSize:10,color:T.textLight,marginTop:2}}>{s.note}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
 
// ── UI Atoms ──────────────────────────────────────────────────────────
function MacroPill({label,value,unit,colorKey}) {
  const T = getT(useDark());
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:5,background:T.tag,border:`1px solid ${T.tagBorder}`,borderRadius:20,padding:"3px 10px",fontSize:11}}>
      <span style={{width:6,height:6,borderRadius:"50%",background:CLR[colorKey],flexShrink:0}}/>
      <span style={{color:T.textLight,fontSize:10,fontFamily:"'DM Mono',monospace",letterSpacing:"0.06em",textTransform:"uppercase"}}>{label}</span>
      <span style={{color:T.text,fontWeight:500}}>{value}{unit}</span>
    </span>
  );
}
function MacroRow({macros}) {
  const items=[["cal",macros.cal,"kcal"],["protein",macros.protein,"g"],["carbs",macros.carbs,"g"],["fat",macros.fat,"g"]];
  if(macros.fiber!=null) items.push(["fiber",macros.fiber,"g"]);
  return <div style={{display:"flex",gap:5,flexWrap:"wrap",margin:"8px 0 12px"}}>{items.map(([k,v,u])=><MacroPill key={k} label={k} value={v} unit={u} colorKey={k}/>)}</div>;
}
function SectionLabel({children}) {
  const T = getT(useDark());
  return <div style={{fontFamily:"'Lora',serif",fontSize:11,letterSpacing:"0.15em",textTransform:"uppercase",color:T.textLight,marginBottom:12}}>{children}</div>;
}
function Steps({items}) {
  const T = getT(useDark());
  return <ol style={{paddingLeft:18,margin:0,display:"flex",flexDirection:"column",gap:8}}>{items.map((s,i)=><li key={i} style={{fontSize:13,lineHeight:1.65,color:T.textMid}}>{s}</li>)}</ol>;
}
function IngList({ingredients}) {
  const T = getT(useDark());
  const { subs } = useSubs();
  const resolved = (ingredients||[]).map(ing=>{
    if(!ing.subKey||!subs[ing.subKey]) return ing;
    const s=ing.substitutions&&ing.substitutions.find(s=>s.id===subs[ing.subKey]);
    return s?{...ing,item:s.item}:ing;
  });
  return (
    <ul style={{listStyle:"none",margin:0,padding:0,display:"flex",flexDirection:"column",gap:6}}>
      {resolved.map((ing,i)=>(
        <li key={i} style={{fontSize:13,color:T.textMid,display:"flex",alignItems:"flex-start"}}>
          <span style={{color:T.gold,marginRight:8,fontSize:10,marginTop:3,flexShrink:0}}>◆</span>
          <span>{ing.item}{ing.subKey&&ing.substitutions&&<SubDropdown ing={ing}/>}</span>
        </li>
      ))}
    </ul>
  );
}
 
// ── Meal Card ─────────────────────────────────────────────────────────
function MealCard({meal,personLabel,personColor,forceOpen}) {
  const T = getT(useDark());
  const [showIng,setShowIng]=useState(false);
  const [showSteps,setShowSteps]=useState(false);
  const mealKey=(meal.day||meal.days||"")+"_"+(personLabel||"")+"_"+(meal.name||"");
  const accentColor = personColor||T.accent;
  return (
    <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"18px 20px",marginBottom:12}}>
      {(meal.day||meal.days)&&<div style={{fontSize:10,color:accentColor,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4}}>{meal.day||meal.days}{personLabel?` · ${personLabel}`:""}</div>}

function scaleN(n,r){const v=Math.round(parseFloat(n)*r*8)/8;if(v===Math.floor(v))return String(v);const w=Math.floor(v),f=v-w;for(const[a,b,s]of[[1,8,"⅛"],[1,4,"¼"],[3,8,"⅜"],[1,2,"½"],[5,8,"⅝"],[3,4,"¾"],[7,8,"⅞"]])if(Math.abs(f-a/b)<0.07)return w>0?w+" "+s:s;return parseFloat((parseFloat(n)*r).toFixed(1)).toString();}
function scaleText(t,d){if(d===5)return t;return t.replace(/(\d+\.?\d*)\s*(lbs?|oz|kg|g|cups?|tbsp|tsp|cans?|pints?|ml)/gi,(m,n,u)=>scaleN(n,d/5)+" "+u);}

// Parse a discrete countable quantity (2-8) from a shopping item string.
function parseItemCount(text) {
  if (/\d+[–—\-]\d+/.test(text)) return null;
  if (/\d+\+/.test(text)) return null;
  if (/~?\d+\.\d+\s*(lbs?|kg|oz|g)\b/i.test(text)) return null;
  const m = text.match(/\b([2-8])\s+(cans?|pints?|fillets?|cartons?|containers?|packs?|bags?|bottles?|jars?|bunches?|loaves?|boxes?)\b/i);
  if (m) return parseInt(m[1]);
  return null;
}
 
function SegmentedCircle({ total, filled, color, borderColor, size=22 }) {
  const cx=size/2, cy=size/2, r=(size-4)/2;
  const allFull = filled >= total;
  if (total === 1) {
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
        <circle cx={cx} cy={cy} r={r} fill={allFull?color:"none"} stroke={allFull?color:borderColor} strokeWidth="2"/>
        {allFull&&<path d={`M${cx-3.5} ${cy} l2.5 2.5 l4.5-4.5`} stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" fill="none"/>}
      </svg>
    );
  }
  const gap = 0.09;
  const sliceAngle = (2*Math.PI)/total;
  const segs = Array.from({length:total},(_,i)=>{
    const s=-Math.PI/2 + i*sliceAngle + gap/2;
    const e=-Math.PI/2 + (i+1)*sliceAngle - gap/2;
    const x1=cx+r*Math.cos(s), y1=cy+r*Math.sin(s);
    const x2=cx+r*Math.cos(e), y2=cy+r*Math.sin(e);
    const la=(e-s)>Math.PI?1:0;
    return (
      <path key={i}
        d={`M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${la} 1 ${x2} ${y2}Z`}
        fill={i<filled?color:"none"}
        stroke={borderColor} strokeWidth="1.5" strokeLinejoin="round"
      />
    );
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={borderColor} strokeWidth="1.5"/>
      {segs}
      {allFull&&<path d={`M${cx-3.5} ${cy} l2.5 2.5 l4.5-4.5`} stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" fill="none"/>}
    </svg>
  );
}
 
function ShoppingTab({week}) {

                        {filled}/{total} — need {total-filled} more
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );

function NutritionTab({week,nutritionDB}) {
  const T = getT(useDark());
  const dark = useDark();
  const [person,setPerson]=useState("jake");
  const targets=week.targets&&week.targets[person];
  if(!targets) return null;
  const goal=targets.goal;
  const dri=nutritionDB._dri&&nutritionDB._dri[person];
 
  // ── Aggregate micros across all meals (Padre's approach) ────────────
  const microKeys = dri ? Object.keys(dri) : [];
  const weekMicros = {};
  microKeys.forEach(k=>weekMicros[k]=0);
 
  const allMeals = [
    ...(person==="jake"
      ? [...(week.jakeSnacks||[]).map(s=>({ingredients:[]})), {ingredients:week.jakeLunch?.ingredients||[]}]

    ),
    ...(week.dinners||[])
  ];
 
  allMeals.forEach(meal=>{
    (meal.ingredients||[]).forEach(ing=>{
      const dbEntry=nutritionDB[ing.nutritionKey];
      if(!dbEntry) return;
      // micros object (sodium, potassium, etc.)
      if(dbEntry.micros) microKeys.forEach(k=>{if(dbEntry.micros[k]!=null) weekMicros[k]+=dbEntry.micros[k];});
      // fiber lives at top level, not inside micros
      if(dbEntry.fiber!=null && weekMicros.fiber!=null) weekMicros.fiber+=dbEntry.fiber;
    });

  const dailyMicros={};
  microKeys.forEach(k=>dailyMicros[k]=Math.round(weekMicros[k]/7));
 
  const color=person==="jake"?T.blue:T.accent;

    {label:"Protein", value:goal[1],unit:"g",   pct:Math.round((targets.total[1]/goal[1])*100),color:"#6b9e6b",bg:dark?"#131e13":"#edf5ed"},
    {label:"Carbs",   value:goal[2],unit:"g",   pct:Math.round((targets.total[2]/goal[2])*100),color:"#c8a96a",bg:dark?"#231e10":"#fdf4e3"},
    {label:"Fat",     value:goal[3],unit:"g",   pct:Math.round((targets.total[3]/goal[3])*100),color:"#7a9ec0",bg:dark?"#101c26":"#eef3f7"},
  ];
 
  return (
    <div>
      <div style={{display:"flex",gap:2,background:T.tag,borderRadius:7,padding:3,marginBottom:24,width:"fit-content"}}>
        {["jake","laine"].map(p=>(

        ))}
      </div>
 
      {/* Water-level macro cells */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
        {waterCells.map(c=><WaterCell key={c.label} {...c} dark={dark}/>)}
      </div>
 
      {/* Breakdown table */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"18px 20px",marginBottom:16}}>
        <SectionLabel>Daily Breakdown</SectionLabel>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr>
                <th style={{textAlign:"left",padding:"6px 10px",color:T.textLight,fontWeight:400,fontFamily:"monospace",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",borderBottom:`1px solid ${T.divider}`}}>Meal</th>
                {[["cal","kcal"],["pro","g"],["carbs","g"],["fat","g"],["fiber","g"]].map(([k])=>(
                  <th key={k} style={{textAlign:"right",padding:"6px 8px",color:CLR[k]||T.textLight,fontWeight:400,fontFamily:"monospace",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",borderBottom:`1px solid ${T.divider}`}}>{k}</th>

                <tr key={i} style={{borderBottom:`1px solid ${T.divider}`}}>
                  <td style={{padding:"9px 10px",color:T.text,fontSize:13}}>{label}</td>
                  {vals.map((v,j)=><td key={j} style={{padding:"9px 8px",textAlign:"right",color:CLR[["cal","protein","carbs","fat","fiber"][j]]||T.textLight,fontFamily:"monospace",fontWeight:500,fontSize:12}}>{v}{j>0?"g":""}</td>)}
                </tr>
              ))}
              <tr style={{background:T.goldSoft}}>
                <td style={{padding:"9px 10px",color:T.textMid,fontFamily:"monospace",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Goal</td>
                {goal.map((v,i)=><td key={i} style={{padding:"9px 8px",textAlign:"right",color:T.textMid,fontFamily:"monospace",fontWeight:500,fontSize:12}}>{v}{i>0?"g":""}</td>)}
              </tr>
            </tbody>
          </table>
        </div>
      </div>
 
      {/* Micros */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"18px 20px"}}>
        <SectionLabel>Micronutrients — Est. Daily Average</SectionLabel>
        <div style={{fontSize:11,color:T.textLight,lineHeight:1.6,marginBottom:18,background:T.goldSoft,borderRadius:8,padding:"10px 12px"}}>
          Estimated from ingredient data averaged across the week. Mediterranean diet is naturally high in potassium, vitamin C, folate, and omega-3s.
        </div>
        {microKeys.length===0||Object.values(dailyMicros).every(v=>v===0)
          ?<div style={{fontSize:12,color:T.textLight}}>Add <code>nutritionKey</code> fields to ingredients in nutrition.json to see micronutrient estimates.</div>
          :<div style={{columns:"2 auto",columnGap:32}}>
            {/* Fiber first */}
            {dri?.fiber&&<MicroBar label="Fiber" value={goal[4]||0} dri={dri.fiber.dri} unit="g" isUpper={false} color={MICRO_CLR.fiber}/>}
            {microKeys.filter(k=>k!=="fiber").map(k=>{
              if(!dri[k]) return null;
              const val=dailyMicros[k]||0;
              return <MicroBar key={k} label={k} value={val} dri={dri[k].dri} unit={dri[k].unit==="mcg"?"mcg":dri[k].unit==="g"?"g":"mg"} isUpper={!!dri[k].upper} color={MICRO_CLR[k]||T.gold}/>;
            })}
          </div>
        }
      </div>
    </div>
  );
}
 
// ── Week View ─────────────────────────────────────────────────────────
function WeekView({week,nutritionDB}) {
  const T = getT(useDark());
  const TABS=["Dinners","Jake","Laine","Breakfasts","Snacks"];
  const [tab,setTab]=useState(0);
  return (
    <div>
      <TabBar tabs={TABS} active={tab} setActive={setTab}/>
 
      {tab===0&&(
        <div>
          <div style={{fontSize:12,color:T.textLight,lineHeight:1.65,marginBottom:16,background:T.goldSoft,border:`1px solid ${T.tagBorder}`,borderRadius:10,padding:"10px 14px"}}>
            Every dinner cooked together — same recipe, different portions. Jake's is always bigger.
          </div>
          {week.dinners.map((d,i)=><DinnerCard key={i} dinner={d} week={week}/>)}
        </div>
      )}
 
      {tab===1&&(
        <div>
          <div style={{fontSize:12,color:T.textLight,lineHeight:1.65,marginBottom:16,background:T.blueSoft,border:`1px solid ${T.blue}22`,borderRadius:10,padding:"10px 14px"}}>Batch cook Sunday — 5 containers, keeps all week.</div>
          <LunchSection lunch={week.jakeLunch} label="Jake" labelColor={T.blue} personColor={T.blue}/>
          <div style={{marginTop:20}}>
            <div style={{fontSize:10,color:T.textLight,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:12}}>Jake's Snacks — pick 1–2 per day</div>
            {(week.jakeSnacks||[]).map((s,i)=>(
              <div key={i} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px 18px",marginBottom:10}}>
                <div style={{fontSize:15,fontWeight:500,color:T.text,fontFamily:"'Lora',serif",marginBottom:4}}>{s.name}</div>
                <MacroRow macros={s.macros}/>
                <div style={{fontSize:12,color:T.textMid,lineHeight:1.6}}>{s.desc}</div>
                <MealRating mealKey={"jsnack_"+(s.name||"")}/>
              </div>
            ))}
          </div>
        </div>
      )}
 
      {tab===2&&(
        <div>
          <div style={{fontSize:12,color:T.textLight,lineHeight:1.65,marginBottom:16,background:T.accentSoft,border:`1px solid ${T.accent}22`,borderRadius:10,padding:"10px 14px"}}>Mason jars batch-made Sunday. Dressing separate. Two sittings per jar.</div>
          <LunchSection lunch={week.laineLunch} label="Laine" labelColor={T.accent} personColor={T.accent}/>
          <div style={{marginTop:20}}>
            <div style={{fontSize:10,color:T.textLight,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:12}}>Laine's Snacks</div>
            {(week.laineSnacks||[]).map((s,i)=>(
              <div key={i} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px 18px",marginBottom:10}}>
                <div style={{fontSize:15,fontWeight:500,color:T.text,fontFamily:"'Lora',serif",marginBottom:4}}>{s.name}</div>
                <MacroRow macros={s.macros}/>
                <div style={{fontSize:12,color:T.textMid,lineHeight:1.6}}>{s.desc}</div>
                <MealRating mealKey={"lsnack_"+(s.name||"")}/>
              </div>
            ))}
          </div>
        </div>
      )}
 
      {tab===3&&(
        <div>
          <div style={{fontSize:12,color:T.textLight,lineHeight:1.65,marginBottom:16,background:T.goldSoft,border:`1px solid ${T.tagBorder}`,borderRadius:10,padding:"10px 14px"}}>Laine only — Jake has coffee.</div>
          {(week.laineBreakfasts||[]).map((b,i)=><MealCard key={i} meal={b} personLabel="Laine" personColor={T.accent}/>)}
        </div>
      )}
 
      {tab===4&&(
        <div>
          {/* Tzatziki recipe card */}
          {week.tzatziki&&<MealCard meal={week.tzatziki} personLabel="Recipe" personColor={T.green}/>}
          <div style={{fontSize:10,color:T.textLight,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",textTransform:"uppercase",marginTop:8,marginBottom:12}}>Jake's Snacks</div>
          {(week.jakeSnacks||[]).map((s,i)=>(
            <div key={i} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px 18px",marginBottom:10}}>
              <div style={{fontSize:15,fontWeight:500,color:T.text,fontFamily:"'Lora',serif",marginBottom:4}}>{s.name}</div>
              <MacroRow macros={s.macros}/><div style={{fontSize:12,color:T.textMid,lineHeight:1.6}}>{s.desc}</div>
              <MealRating mealKey={"jsnack_"+(s.name||"")}/>
            </div>
          ))}
          <div style={{fontSize:10,color:T.textLight,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",textTransform:"uppercase",marginTop:20,marginBottom:12}}>Laine's Snacks</div>
          {(week.laineSnacks||[]).map((s,i)=>(
            <div key={i} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px 18px",marginBottom:10}}>
              <div style={{fontSize:15,fontWeight:500,color:T.text,fontFamily:"'Lora',serif",marginBottom:4}}>{s.name}</div>
              <MacroRow macros={s.macros}/><div style={{fontSize:12,color:T.textMid,lineHeight:1.6}}>{s.desc}</div>
              <MealRating mealKey={"lsnack_"+(s.name||"")}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
 
// ── History ───────────────────────────────────────────────────────────
function HistoryTab({allWeeks,nutritionDB}) {
  const T = getT(useDark());
  const [viewing,setViewing]=useState(null);
  const past=allWeeks.filter(w=>w.id!==CURRENT_WEEK_ID).reverse();
  if(viewing) return (
    <div>
      <button onClick={()=>setViewing(null)} style={{display:"flex",alignItems:"center",gap:8,background:"none",border:`1px solid ${T.border}`,borderRadius:8,color:T.textMid,padding:"7px 14px",fontSize:12,marginBottom:24}}>← Back</button>
      <div style={{fontSize:13,color:T.accent,fontFamily:"'Lora',serif",marginBottom:20}}>{viewing.label}</div>
      <WeekView week={viewing} nutritionDB={nutritionDB}/>
    </div>
  );
  if(!past.length) return <div style={{textAlign:"center",padding:"60px 0",color:T.textLight,fontSize:14}}>No past weeks yet.</div>;
  return (
    <div>
      <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em",color:T.textLight,fontFamily:"'DM Mono',monospace",marginBottom:16}}>{past.length} past week{past.length!==1?"s":""}</div>
      {past.map(week=>(
        <div key={week.id} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div>
            <div style={{fontSize:15,fontFamily:"'Lora',serif",color:T.text,marginBottom:4}}>{week.label}</div>
            <div style={{fontSize:11,color:T.textLight,fontFamily:"monospace"}}>{(week.dinners||[]).length} dinners</div>
          </div>
          <button onClick={()=>setViewing(week)} style={{background:T.accentSoft,border:`1px solid ${T.tagBorder}`,borderRadius:8,color:T.accent,padding:"7px 14px",fontSize:12}}>View</button>
        </div>
      ))}
    </div>
  );
}
 
// ── Dark Mode Toggle ──────────────────────────────────────────────────
function DarkToggle({dark,setDark}) {
  const T = getT(dark);
  return (
    <button onClick={()=>{setDark(!dark);localStorage.setItem(DARK_KEY,String(!dark));document.body.className=!dark?"dark":"light";}}
      style={{background:T.tag,border:`1px solid ${T.border}`,borderRadius:20,padding:"5px 14px",fontSize:11,color:T.textMid,display:"flex",alignItems:"center",gap:7,transition:"all 0.2s"}}>
      <span style={{fontSize:14}}>{dark?"☀️":"🌙"}</span>
      <span style={{fontFamily:"'DM Mono',monospace",letterSpacing:"0.06em",textTransform:"uppercase"}}>{dark?"Light":"Dark"}</span>
    </button>
  );
}
 
// ── App ───────────────────────────────────────────────────────────────
function App() {
  const [dark,setDark]=useState(()=>{const s=localStorage.getItem(DARK_KEY);if(s!=null)return s==="true";return window.matchMedia("(prefers-color-scheme: dark)").matches;});
  const T = getT(dark);
  const [mainTab,setMainTab]=useState(0);
  const [allWeeks,setAllWeeks]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [nutritionDB,setNutritionDB]=useState({});
  const [subs,setSubs]=useState(()=>{try{return JSON.parse(localStorage.getItem("jl_subs")||"{}");}catch{return {};}});
  const setSub=useCallback((k,v)=>setSubs(p=>{const n={...p};if(v==null)delete n[k];else n[k]=v;localStorage.setItem("jl_subs",JSON.stringify(n));return n;}),[]);
  const [openKey,setOpenKey]=useState(null);
 
  useEffect(()=>{
    document.body.className=dark?"dark":"light";
    document.body.style.setProperty("--scroll-track",dark?"#1a1710":"#f5f0e8");
  },[dark]);
 
  useEffect(()=>{
    fetch("nutrition.json").then(r=>r.json()).then(setNutritionDB).catch(()=>{});
    (async()=>{
      try{
        const results=await Promise.all(WEEK_REGISTRY.map(async({id,label})=>{
          const res=await fetch("weeks/"+id+".json");
          if(!res.ok) throw new Error("Could not load "+id+".json");
          return{...await res.json(),id,label};
        }));
        setAllWeeks(results);
      }catch(e){setError(e.message);}
      finally{setLoading(false);}
    })();
  },[]);
 
  const currentWeek=allWeeks.find(w=>w.id===CURRENT_WEEK_ID);
  const MAIN_TABS=["This Week","Shopping","Nutrition","Past Weeks"];
 
  if(loading) return <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",color:T.textLight,fontSize:13,fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em"}}>Loading…</div>;
  if(error) return <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{textAlign:"center"}}><div style={{color:T.accent,fontFamily:"'Lora',serif",fontSize:18,marginBottom:8}}>Something's off</div><div style={{color:T.textLight,fontSize:11}}>{error}</div></div></div>;
 
  return (
    <DarkCtx.Provider value={dark}>
    <DropCtx.Provider value={{openKey,setOpenKey}}>
    <SubsCtx.Provider value={{subs,setSub}}>
    <NutCtx.Provider value={nutritionDB}>
      <div style={{minHeight:"100vh",background:T.bg,color:T.text,padding:"40px 20px 80px",transition:"background 0.3s,color 0.3s"}}>
        <div style={{maxWidth:860,margin:"0 auto"}}>
 
          {/* Header */}
          <div style={{marginBottom:24,borderBottom:`1px solid ${T.divider}`,paddingBottom:24}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
              <div>
                <div style={{fontSize:10,letterSpacing:"0.2em",textTransform:"uppercase",color:T.textLight,marginBottom:8,fontFamily:"'DM Mono',monospace"}}>Mediterranean · Meal Plan</div>
                <h1 style={{fontFamily:"'Lora',serif",fontSize:"clamp(2rem,6vw,3.2rem)",fontWeight:400,lineHeight:1.1,color:T.text}}>
                  Jake <span style={{color:T.gold}}>&amp;</span> <span style={{color:T.accent,fontStyle:"italic"}}>Laine.</span>
                </h1>
                {currentWeek&&<div style={{fontSize:11,color:T.textLight,fontFamily:"'DM Mono',monospace",textTransform:"uppercase",letterSpacing:"0.1em",marginTop:10}}>{currentWeek.label}</div>}
              </div>
              <DarkToggle dark={dark} setDark={setDark}/>
            </div>
          </div>
 
          <WaterTracker/>
 
          {/* Nav */}
          <div style={{display:"flex",gap:3,background:T.tag,border:`1px solid ${T.border}`,borderRadius:14,padding:4,marginBottom:28,maxWidth:520}}>
            {MAIN_TABS.map((t,i)=>(
              <button key={t} onClick={()=>setMainTab(i)} style={{flex:1,padding:"9px 12px",background:mainTab===i?T.card:"none",border:`1px solid ${mainTab===i?T.border:"transparent"}`,borderRadius:10,color:mainTab===i?T.text:T.textLight,fontSize:12,fontWeight:mainTab===i?500:400,transition:"all 0.15s"}}>{t}</button>
            ))}
          </div>
 
          {mainTab===0&&currentWeek&&<WeekView week={currentWeek} nutritionDB={nutritionDB}/>}
          {mainTab===1&&currentWeek&&<ShoppingTab week={currentWeek}/>}
          {mainTab===2&&currentWeek&&<NutritionTab week={currentWeek} nutritionDB={nutritionDB}/>}
          {mainTab===3&&<HistoryTab allWeeks={allWeeks} nutritionDB={nutritionDB}/>}
 
          <div style={{marginTop:64,paddingTop:28,borderTop:`1px solid ${T.divider}`,textAlign:"center"}}>
            <div style={{fontFamily:"'Lora',serif",fontSize:"clamp(1.1rem,3vw,1.4rem)",fontWeight:400,fontStyle:"italic",color:T.textLight}}>
              Love you both. <span style={{color:T.accent}}>♥</span>
            </div>
          </div>
        </div>
      </div>
    </NutCtx.Provider>
    </SubsCtx.Provider>
    </DropCtx.Provider>
    </DarkCtx.Provider>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
