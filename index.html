<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake & Laine — Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f5f0e8; color:#2a2418; font-family:'Barlow',sans-serif; font-weight:300; min-height:100vh; }
  button { font-family:'Barlow',sans-serif; }
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:#ede8de; }
  ::-webkit-scrollbar-thumb { background:#b8a88a; border-radius:3px; }
  ::selection { background:#f0e0b8; }
  @keyframes wave1 { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
  @keyframes wave2 { 0%{transform:translateX(0)} 100%{transform:translateX(50%)} }
  @keyframes glassSlide { from{y:9999px} to{y:var(--gy)} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
 
const { useState, useEffect, useContext, createContext, useCallback, useRef } = React;
 
const WEEK_REGISTRY = [
  { id:"2026-W19", label:"Week of May 4, 2026" },
  { id:"2026-W20", label:"Week of May 11, 2026" },
  { id:"2026-W21", label:"Week of May 18, 2026" },
  { id:"2026-W22", label:"Week of May 25, 2026" },
  { id:"2026-W23", label:"Week of June 1, 2026" },
];
const CURRENT_WEEK_ID = "2026-W23";
 
// Water: 8 glasses × 16oz = 128oz = 1 gallon
const WATER_GLASSES   = 8;
const WATER_OZ_EACH   = 16;
const WATER_TOTAL_OZ  = WATER_GLASSES * WATER_OZ_EACH;
const WATER_KEY       = "jl_water";
const RATINGS_KEY     = "jl_ratings";
 
const SubsCtx         = createContext({ subs:{}, setSub:()=>{} });
const useSubs         = () => useContext(SubsCtx);
const OpenDropCtx     = createContext({ openKey:null, setOpenKey:()=>{} });
const useOpenDrop     = () => useContext(OpenDropCtx);
const NutritionDBCtx  = createContext({});
const useNutritionDB  = () => useContext(NutritionDBCtx);
 
const T = {
  bg:"#f5f0e8", card:"#ffffff", border:"#e8dfc8",
  accent:"#7a3e2e", accentSoft:"#f5ede0",
  gold:"#c4a86e", goldSoft:"#fdf4e3",
  green:"#3a6b4a", greenSoft:"#edf5ed",
  blue:"#2e5a7a", blueSoft:"#eef3f7",
  text:"#2a2418", textMid:"#6a5a48", textLight:"#9a8a6e",
  divider:"#e8dfc8", tag:"#f5f0e8", tagBorder:"#e0d5c0",
};
 
const CLR = { cal:"#8b6914", protein:"#7a3e2e", carbs:"#3a6b4a", fat:"#2e5a7a", fiber:"#5a6b3a" };
 
// ── Midnight-reset water ─────────────────────────────────────────────
function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function loadWater() {
  try {
    const raw = JSON.parse(localStorage.getItem(WATER_KEY)||"{}");
    if (raw.date !== getTodayKey()) return Array(WATER_GLASSES).fill(true);
    return raw.glasses;
  } catch { return Array(WATER_GLASSES).fill(true); }
}
function saveWater(g) {
  localStorage.setItem(WATER_KEY, JSON.stringify({ date:getTodayKey(), glasses:g }));
}
 
// ── Rating system ────────────────────────────────────────────────────
function loadRatings() {
  try { return JSON.parse(localStorage.getItem(RATINGS_KEY)||"{}"); } catch { return {}; }
}
function saveRatings(r) { localStorage.setItem(RATINGS_KEY, JSON.stringify(r)); }
 
const RATING_LABELS = {
  0:"Hard pass", 1:"Not our thing", 2:"Wouldn't make again",
  3:"Missing something", 4:"It'll do", 5:"Solid middle ground",
  6:"Genuinely enjoyed it", 7:"Would request this again",
  8:"Really hit the spot", 9:"Borderline perfect", 10:"Make this every week!"
};
 
const SUBMIT_BUTTONS = [
  "🫒 That's a keeper","🍋 Squeeze it in","🧑‍🍳 Chef's kiss — save it",
  "🐟 Reel it in","🥗 Toss & save","🫙 Jar that rating",
  "🌿 Fresh take — saved","🍳 Plate it","🧄 Lock it in","🥂 Done — saved",
];
 
function MealRating({ mealKey }) {
  const [ratings, setRatings] = useState(loadRatings);
  const [pending, setPending] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [showSaved, setShowSaved] = useState(false);
  const [btnLabel] = useState(() => SUBMIT_BUTTONS[Math.floor(Math.random()*SUBMIT_BUTTONS.length)]);
  const trackRef = useRef(null);
  const saveTimer = useRef(null);
 
  const saved = ratings[mealKey];
  const draft = pending != null ? pending : saved;
  const hasDraft = pending != null;
  const hasSaved = saved != null;
  const isChanged = hasDraft && pending !== saved;
 
  const posFromValue = v => `${(v/10)*100}%`;
 
  const valueFromEvent = (e) => {
    if (!trackRef.current) return 0;
    const rect = trackRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return Math.round(Math.max(0,Math.min(1,(clientX-rect.left)/rect.width))*10);
  };
 
  const handleDragStart = e => { setDragging(true); setPending(valueFromEvent(e)); };
  const handleDragMove  = e => { if (!dragging) return; e.preventDefault(); setPending(valueFromEvent(e)); };
  const handleDragEnd   = () => setDragging(false);
 
  const commit = () => {
    if (pending==null) return;
    const next = { ...loadRatings(), [mealKey]: pending };
    saveRatings(next); setRatings(next); setPending(null);
    clearTimeout(saveTimer.current);
    setShowSaved(true);
    saveTimer.current = setTimeout(()=>setShowSaved(false), 2200);
  };
 
  const ratingColor = v => {
    if (v==null) return T.textLight;
    if (v<=3) return "#c05050";
    if (v<=6) return T.gold;
    return T.green;
  };
 
  const displayColor = ratingColor(draft!=null?draft:null);
 
  return (
    <div style={{ marginTop:14, paddingTop:12, borderTop:`1px solid ${T.divider}` }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
        <span style={{ fontSize:11, color:T.textLight, fontFamily:"'DM Mono',monospace", letterSpacing:"0.08em", textTransform:"uppercase" }}>
          Rate this meal
        </span>
        <span style={{ fontSize:11, fontWeight:500, color:showSaved?T.green:displayColor, transition:"color 0.2s", fontStyle:draft==null?"italic":"normal" }}>
          {showSaved ? "✓ saved!"
            : draft!=null ? `${draft}/10 — ${RATING_LABELS[draft]}`
            : "drag to set a score"}
        </span>
      </div>
 
      {/* Slider */}
      <div style={{ position:"relative", height:36, cursor:"ew-resize", userSelect:"none", touchAction:"none" }}
        ref={trackRef}
        onMouseDown={handleDragStart}
        onMouseMove={e=>{ if(dragging){e.preventDefault();setPending(valueFromEvent(e));} }}
        onMouseUp={handleDragEnd} onMouseLeave={handleDragEnd}
        onTouchStart={handleDragStart} onTouchMove={handleDragMove} onTouchEnd={handleDragEnd}
      >
        {/* Track */}
        <div style={{ position:"absolute", top:"50%", left:0, right:0, height:6, transform:"translateY(-50%)", background:"#ede8de", borderRadius:3 }}>
          {draft!=null && (
            <div style={{ height:"100%", width:posFromValue(draft), background:`linear-gradient(to right,#c05050,${T.gold},${T.green})`, borderRadius:3, opacity:isChanged?0.6:1, transition:dragging?"none":"width 0.1s" }} />
          )}
        </div>
        {/* Ticks */}
        {Array.from({length:11},(_,i)=>(
          <div key={i} style={{ position:"absolute", top:"50%", left:`${(i/10)*100}%`, transform:"translate(-50%,-50%)", width:i===0||i===10?3:2, height:i===0||i===10?12:7, background:T.divider, borderRadius:1 }} />
        ))}
        {/* Thumb */}
        {draft!=null ? (
          <div style={{ position:"absolute", top:"50%", left:posFromValue(draft), transform:"translate(-50%,-50%)", width:22, height:22, borderRadius:"50%", background:isChanged?"#e8c87a":displayColor, border:"2px solid white", boxShadow:"0 2px 8px rgba(0,0,0,0.18)", transition:dragging?"none":"left 0.1s,background 0.2s", zIndex:2, display:"flex", alignItems:"center", justifyContent:"center" }}>
            <span style={{ fontSize:9, fontWeight:700, color:"white", fontFamily:"monospace" }}>{draft}</span>
          </div>
        ) : (
          <div style={{ position:"absolute", top:"50%", left:"50%", transform:"translate(-50%,-50%)", width:22, height:22, borderRadius:"50%", background:T.divider, border:`2px dashed ${T.textLight}`, zIndex:2 }} />
        )}
      </div>
 
      {/* Axis */}
      <div style={{ display:"flex", justifyContent:"space-between", marginTop:2, marginBottom:10 }}>
        <span style={{ fontSize:9, color:T.textLight, fontFamily:"monospace" }}>0</span>
        <span style={{ fontSize:9, color:T.textLight, fontFamily:"monospace" }}>10</span>
      </div>
 
      {/* Submit */}
      <div style={{ overflow:"hidden", maxHeight:isChanged?48:0, opacity:isChanged?1:0, transition:"max-height 0.25s ease,opacity 0.2s ease" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"flex-end", gap:10 }}>
          <button onClick={()=>setPending(saved??null)} style={{ background:"none", border:"none", fontSize:11, color:T.textLight, cursor:"pointer", padding:"4px 8px" }}>Cancel</button>
          <button onClick={commit} style={{ background:T.accentSoft, border:`1px solid ${T.accent}`, borderRadius:20, padding:"7px 16px", fontSize:12, fontWeight:500, color:T.accent, cursor:"pointer", transition:"background 0.15s" }}
            onMouseEnter={e=>e.target.style.background="#eed0b8"} onMouseLeave={e=>e.target.style.background=T.accentSoft}>
            {btnLabel}
          </button>
        </div>
      </div>
 
      {hasSaved && !isChanged && !showSaved && (
        <div style={{ display:"flex", justifyContent:"flex-end" }}>
          <button onClick={()=>setPending(saved)} style={{ background:"none", border:"none", fontSize:10, color:T.textLight, cursor:"pointer", padding:0, textDecoration:"underline" }}>edit rating</button>
        </div>
      )}
    </div>
  );
}
 
// ── Water Glass SVG (16oz each) ──────────────────────────────────────
function WaterGlass({ full, onClick, index }) {
  const W=32, H=44;
  const strokeClr = full ? "#5a9ec0" : "#2a2418";
  const strokeW   = full ? 1.5 : 2;
  return (
    <button onClick={onClick} title={full?"Tap when you've drunk this glass":"Tap to undo"}
      style={{ background:"none", border:"none", cursor:"pointer", padding:4, display:"flex", flexDirection:"column", alignItems:"center", gap:3, transition:"transform 0.1s" }}>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none" xmlns="http://www.w3.org/2000/svg">
        <clipPath id={`gc${index}`}>
          <path d={`M5 3 L${W-5} 3 L${W-6.5} ${H-3} L6.5 ${H-3} Z`} />
        </clipPath>
        <rect x="0" y={full?6:H+2} width={W} height={H} fill="#7ab8d8" fillOpacity="0.82"
          clipPath={`url(#gc${index})`} style={{ transition:"y 0.35s cubic-bezier(.4,0,.2,1)" }} />
        {full && <line x1="7" y1="10" x2={W-7} y2="10" stroke="#a8d4ea" strokeWidth="1" strokeOpacity="0.7"/>}
        <path d={`M4 3 L${W-4} 3 L${W-6} ${H-3} L6 ${H-3} Z`} fill="none" stroke={strokeClr} strokeWidth={strokeW} strokeLinejoin="round"/>
        {!full && <text x={W/2} y={H/2+5} textAnchor="middle" fontSize="13" fill="#2a2418" fontWeight="bold" fontFamily="sans-serif">✓</text>}
      </svg>
      <span style={{ fontSize:9, color:full?"#2e5a7a":"#2a2418", fontFamily:"monospace", fontWeight:full?400:700 }}>{index*WATER_OZ_EACH+WATER_OZ_EACH}oz</span>
    </button>
  );
}
 
// ── Water Tracker ────────────────────────────────────────────────────
function WaterTracker() {
  const [glasses, setGlasses] = useState(loadWater);
 
  useEffect(() => {
    const msUntilMidnight = () => {
      const now = new Date(), midnight = new Date(now);
      midnight.setHours(24,0,0,0);
      return midnight-now;
    };
    const tid = setTimeout(() => {
      const fresh = Array(WATER_GLASSES).fill(true);
      setGlasses(fresh); saveWater(fresh);
    }, msUntilMidnight());
    return () => clearTimeout(tid);
  }, [glasses]);
 
  const toggle = i => setGlasses(prev => {
    const next=[...prev]; next[i]=!next[i]; saveWater(next); return next;
  });
 
  const drunk   = glasses.filter(g=>!g).length;
  const ozDone  = drunk * WATER_OZ_EACH;
  const ozLeft  = WATER_TOTAL_OZ - ozDone;
  const allDone = drunk === WATER_GLASSES;
  const pct     = (ozDone / WATER_TOTAL_OZ) * 100;
 
  return (
    <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:16, padding:"16px 20px", marginBottom:28 }}>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:14 }}>
        <div>
          <div style={{ fontSize:11, letterSpacing:"0.12em", textTransform:"uppercase", color:"#2e5a7a", fontFamily:"'DM Mono',monospace", marginBottom:3 }}>Water Today</div>
          <div style={{ fontSize:13, fontFamily:"'Lora',serif", color:T.text }}>
            {allDone ? "✓ Full gallon — nice." : `${ozDone}oz of ${WATER_TOTAL_OZ}oz · ${ozLeft}oz to go`}
          </div>
        </div>
        <div style={{ fontSize:10, color:T.textLight, textAlign:"right", lineHeight:1.6, fontFamily:"'DM Mono',monospace" }}>
          Tap when<br/>you drink it
        </div>
      </div>
 
      {/* Progress bar */}
      <div style={{ height:4, background:"#e0ecf5", borderRadius:3, marginBottom:14, overflow:"hidden", position:"relative" }}>
        <div style={{ height:"100%", width:`${pct}%`, background:`linear-gradient(to right, #7ab8d8, #2e5a7a)`, borderRadius:3, transition:"width 0.4s cubic-bezier(.4,0,.2,1)" }} />
      </div>
 
      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
        {glasses.map((full,i) => <WaterGlass key={i} index={i} full={full} onClick={()=>toggle(i)} />)}
      </div>
 
      {drunk>0 && !allDone && (
        <button onClick={()=>{ const f=Array(WATER_GLASSES).fill(true); setGlasses(f); saveWater(f); }}
          style={{ marginTop:10, background:"none", border:"none", fontSize:10, color:T.textLight, cursor:"pointer", padding:0 }}>↺ Reset</button>
      )}
    </div>
  );
}
 
// ── Sub Dropdown ─────────────────────────────────────────────────────
function SubDropdown({ ing }) {
  const { subs, setSub } = useSubs();
  const { openKey, setOpenKey } = useOpenDrop();
  const btnRef = useRef(null);
  const isOpen = openKey === ing.subKey;
  const current = subs[ing.subKey] || "default";
  const [menuStyle, setMenuStyle] = useState({});
  const toggle = () => {
    if (!isOpen && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      const below = window.innerHeight - r.bottom;
      const mh = Math.min(280, 44 + ing.substitutions.length*52);
      setMenuStyle({ top:Math.max(8,below>mh?r.bottom+6:r.top-mh-6), left:Math.min(r.left,window.innerWidth-230) });
    }
    setOpenKey(isOpen?null:ing.subKey);
  };
  return (
    <div style={{ display:"inline-block" }}>
      <button ref={btnRef} onClick={toggle} style={{ background:"none", border:`1px solid ${T.border}`, borderRadius:5, color:T.textLight, padding:"1px 7px", cursor:"pointer", fontSize:10, marginLeft:6 }}>swap {isOpen?"▲":"▼"}</button>
      {isOpen && (
        <div style={{ position:"fixed", ...menuStyle, zIndex:1000, background:T.card, border:`1px solid ${T.gold}`, borderRadius:12, padding:6, width:220, boxShadow:"0 8px 32px rgba(80,50,10,0.12)" }}>
          <div onClick={()=>{setSub(ing.subKey,null);setOpenKey(null);}} style={{ padding:"9px 12px", fontSize:12, cursor:"pointer", borderRadius:8, color:current==="default"?T.green:T.textMid, background:current==="default"?T.greenSoft:"none" }}>
            {ing.item} <span style={{ color:T.textLight, fontSize:10 }}>(original)</span>
          </div>
          {ing.substitutions.map(sub=>(
            <div key={sub.id} onClick={()=>{setSub(ing.subKey,sub.id);setOpenKey(null);}} style={{ padding:"9px 12px", fontSize:12, cursor:"pointer", borderRadius:8, color:current===sub.id?T.green:T.textMid, background:current===sub.id?T.greenSoft:"none" }}>
              {sub.item}
              {sub.note && <div style={{ fontSize:10, color:T.textLight, marginTop:2 }}>{sub.note}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
 
function IngredientList({ ingredients }) {
  const { subs } = useSubs();
  const resolved = (ingredients||[]).map(ing => {
    if (!ing.subKey||!subs[ing.subKey]) return ing;
    const sub = ing.substitutions&&ing.substitutions.find(s=>s.id===subs[ing.subKey]);
    return sub ? {...ing,item:sub.item} : ing;
  });
  return (
    <ul style={{ listStyle:"none", margin:0, padding:0, display:"flex", flexDirection:"column", gap:6 }}>
      {resolved.map((ing,i)=>(
        <li key={i} style={{ fontSize:13, color:T.textMid, display:"flex", alignItems:"flex-start" }}>
          <span style={{ color:T.gold, marginRight:8, fontSize:10, marginTop:3, flexShrink:0 }}>◆</span>
          <span>{ing.item}{ing.subKey&&ing.substitutions&&<SubDropdown ing={ing}/>}</span>
        </li>
      ))}
    </ul>
  );
}
 
// ── Macro Pills ───────────────────────────────────────────────────────
function MacroPill({ label, value, unit, colorKey }) {
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:5, background:T.tag, border:`1px solid ${T.tagBorder}`, borderRadius:20, padding:"3px 10px", fontSize:11 }}>
      <span style={{ width:6, height:6, borderRadius:"50%", background:CLR[colorKey], flexShrink:0 }}/>
      <span style={{ color:T.textLight, fontSize:10, fontFamily:"'DM Mono',monospace", letterSpacing:"0.06em", textTransform:"uppercase" }}>{label}</span>
      <span style={{ color:T.text, fontWeight:500 }}>{value}{unit}</span>
    </span>
  );
}
 
function MacroRow({ macros }) {
  if (!macros) return null;
  const items = [["cal",macros.cal,"kcal"],["protein",macros.protein,"g"],["carbs",macros.carbs,"g"],["fat",macros.fat,"g"]];
  if (macros.fiber!=null) items.push(["fiber",macros.fiber,"g"]);
  return (
    <div style={{ display:"flex", gap:5, flexWrap:"wrap", margin:"8px 0 12px" }}>
      {items.map(([k,v,u])=><MacroPill key={k} label={k} value={v} unit={u} colorKey={k}/>)}
    </div>
  );
}
 
function Steps({ items }) {
  return (
    <ol style={{ paddingLeft:18, margin:0, display:"flex", flexDirection:"column", gap:8 }}>
      {items.map((s,i)=><li key={i} style={{ fontSize:13, lineHeight:1.65, color:T.textMid }}>{s}</li>)}
    </ol>
  );
}
 
function SectionLabel({ children }) {
  return <div style={{ fontFamily:"'Lora',serif", fontSize:11, letterSpacing:"0.15em", textTransform:"uppercase", color:T.textLight, marginBottom:12 }}>{children}</div>;
}
 
// ── Meal Card — Padre's style, Jake & Laine colours ──────────────────
function MealCard({ meal, personLabel, personColor }) {
  const [showIng, setShowIng] = useState(false);
  const [showSteps, setShowSteps] = useState(false);
  const dayLabel = meal.day || meal.days;
  const mealKey = (dayLabel||"")+"_"+(personLabel||"")+"_"+(meal.name||"");
 
  return (
    <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:16, padding:"18px 20px", marginBottom:12 }}>
      {dayLabel && (
        <div style={{ fontSize:10, color:personColor||T.textLight, fontFamily:"'DM Mono',monospace", letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:4 }}>
          {dayLabel}{personLabel ? ` · ${personLabel}` : ""}
        </div>
      )}
      <div style={{ fontSize:16, fontWeight:500, color:T.text, fontFamily:"'Lora',serif", marginBottom:4 }}>{meal.name}</div>
      {meal.macros && <MacroRow macros={meal.macros}/>}
      {meal.note && <div style={{ fontSize:12, color:T.textLight, lineHeight:1.65, marginBottom:10, fontStyle:"italic" }}>{meal.note}</div>}
 
      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
        {meal.ingredients && (
          <button onClick={()=>setShowIng(!showIng)} style={{ background:showIng?T.goldSoft:T.tag, border:`1px solid ${T.tagBorder}`, borderRadius:20, padding:"4px 12px", cursor:"pointer", fontSize:11, color:T.textMid, transition:"background 0.15s" }}>
            {showIng?"▲":"▼"} Ingredients
          </button>
        )}
        {meal.steps && (
          <button onClick={()=>setShowSteps(!showSteps)} style={{ background:showSteps?T.accentSoft:T.tag, border:`1px solid ${T.tagBorder}`, borderRadius:20, padding:"4px 12px", cursor:"pointer", fontSize:11, color:T.textMid, transition:"background 0.15s" }}>
            {showSteps?"▲":"▼"} Steps
          </button>
        )}
      </div>
 
      {showIng && (
        <div style={{ marginTop:12, paddingTop:12, borderTop:`1px solid ${T.divider}` }}>
          <SectionLabel>Ingredients</SectionLabel>
          <IngredientList ingredients={meal.ingredients}/>
        </div>
      )}
      {showSteps && (
        <div style={{ marginTop:12, paddingTop:12, borderTop:`1px solid ${T.divider}` }}>
          <SectionLabel>Method</SectionLabel>
          <Steps items={meal.steps}/>
        </div>
      )}
      <MealRating mealKey={mealKey}/>
    </div>
  );
}
 
// ── Dinner Card — shows both Jake and Laine macros ───────────────────
function DinnerCard({ dinner }) {
  const [showIng, setShowIng] = useState(false);
  const [showSteps, setShowSteps] = useState(false);
  const mealKey = "dinner_"+(dinner.day||"")+"_"+(dinner.name||"");
 
  return (
    <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:16, padding:"18px 20px", marginBottom:12 }}>
      <div style={{ fontSize:10, color:T.textLight, fontFamily:"'DM Mono',monospace", letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:4 }}>{dinner.day}</div>
      <div style={{ fontSize:16, fontWeight:500, color:T.text, fontFamily:"'Lora',serif", marginBottom:6 }}>{dinner.name}</div>
      {dinner.note && <div style={{ fontSize:12, color:T.textLight, lineHeight:1.65, marginBottom:10, fontStyle:"italic" }}>{dinner.note}</div>}
 
      {/* Side-by-side macros */}

function DaysSelector({ days, setDays, color }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
      <span style={{ fontSize:11, color:T.textLight, fontFamily:"'DM Mono',monospace", letterSpacing:"0.06em", textTransform:"uppercase" }}>Prepping for</span>
      <div style={{ display:"flex", gap:3 }}>
        {[1,2,3,4,5].map(n=>(
          <button key={n} onClick={()=>setDays(n)} style={{ width:28, height:28, borderRadius:6, border:`1px solid ${days===n?color:T.tagBorder}`, background:days===n?color+"22":"none", color:days===n?color:T.textLight, fontSize:12, cursor:"pointer", fontFamily:"'DM Mono',monospace", transition:"all 0.15s" }}>{n}</button>
        ))}
      </div>
      <span style={{ fontSize:11, color:T.textLight }}>day{days!==1?"s":""}</span>
    </div>
  );
}
function scaleN(num, ratio) {
  const r=Math.round(parseFloat(num)*ratio*8)/8;
  if(r===Math.floor(r)) return String(r);
  const whole=Math.floor(r),frac=r-whole;
  for(const [n,d,s] of [[1,8,"1/8"],[1,4,"1/4"],[3,8,"3/8"],[1,2,"1/2"],[5,8,"5/8"],[3,4,"3/4"],[7,8,"7/8"]])
    if(Math.abs(frac-n/d)<0.07) return whole>0?whole+" "+s:s;
  return parseFloat((parseFloat(num)*ratio).toFixed(1)).toString();
}
function scaleText(text,days){
  if(days===5) return text;
  return text.replace(/(\d+\.?\d*)\s*(lbs?|oz|kg|g|cups?|tbsp|tsp|cans?|pints?|ml)/gi,(m,num,unit)=>scaleN(num,days/5)+" "+unit);
}

  return (

function MicroBar({ label, value, dri, unit, isUpper, color }) {
  const pct = Math.min(100,Math.round((value/dri)*100));
  const over = value > dri;
  return (
    <div style={{ marginBottom:14 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:4 }}>
        <span style={{ fontSize:12, color:T.textMid, textTransform:"capitalize" }}>{label.replace(/_/g," ")}</span>
        <span style={{ fontSize:11, fontFamily:"monospace", color:over?"#c05050":T.textLight }}>
          {value}{unit} <span style={{ color:T.textLight }}>/ {dri}{unit}</span>
        </span>
      </div>
      <div style={{ height:6, background:"#ede8de", borderRadius:3, overflow:"hidden" }}>
        <div style={{ height:"100%", width:`${pct}%`, background:over?"#e07070":(color||T.gold), borderRadius:3, transition:"width 0.4s" }}/>
      </div>
      {over&&isUpper&&<div style={{ fontSize:10, color:"#c05050", marginTop:2 }}>↑ above target</div>}
    </div>
  );
}

  if (!past.length) return (
    <div style={{ textAlign:"center", padding:"60px 0", color:T.textLight }}>
      <div style={{ fontSize:32, marginBottom:12 }}>🫙</div>
      <div style={{ fontSize:14 }}>No past weeks yet.</div>
      <div style={{ fontSize:12, marginTop:6 }}>Past weeks appear here as you add new JSON files to weeks/.</div>
    </div>
  );
  return (
    <div>
      <div style={{ fontSize:11, textTransform:"uppercase", letterSpacing:"0.1em", color:T.textLight, marginBottom:16 }}>{past.length} past week{past.length!==1?"s":""}</div>
      {past.map(week=>(
        <div key={week.id} style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:14, padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
          <div>
            <div style={{ fontSize:15, fontFamily:"'Lora',serif", marginBottom:4 }}>{week.label}</div>
            <div style={{ fontSize:11, color:T.textLight, fontFamily:"monospace" }}>{(week.dinners||[]).length} dinners</div>
          </div>
          <button onClick={()=>setViewing(week)} style={{ background:T.accentSoft, border:`1px solid ${T.tagBorder}`, borderRadius:8, color:T.accent, padding:"7px 14px", cursor:"pointer", fontSize:12 }}>View</button>
        </div>
      ))}
    </div>
  );
}
 
// ── App ───────────────────────────────────────────────────────────────
function App() {
  const [mainTab, setMainTab]   = useState(0);
  const [allWeeks, setAllWeeks] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [error, setError]       = useState(null);
  const [nutritionDB, setNutritionDB] = useState({});
  const [subs, setSubs] = useState(()=>{ try{return JSON.parse(localStorage.getItem("jl_subs")||"{}");} catch{return {};} });
  const setSub = useCallback((key,val)=>setSubs(prev=>{ const next={...prev}; if(val==null) delete next[key]; else next[key]=val; localStorage.setItem("jl_subs",JSON.stringify(next)); return next; }), []);
  const [openKey, setOpenKey] = useState(null);
 
  useEffect(()=>{
    fetch("nutrition.json").then(r=>r.json()).then(setNutritionDB).catch(()=>{});
    (async()=>{
      try {
        const results = await Promise.all(WEEK_REGISTRY.map(async({id,label})=>{
          const res = await fetch("weeks/"+id+".json");
          if(!res.ok) throw new Error("Could not load "+id+".json");
          return {...await res.json(), id, label};
        }));
        setAllWeeks(results);
      } catch(e) { setError(e.message); }
      finally { setLoading(false); }
    })();
  },[]);
 
  const currentWeek = allWeeks.find(w=>w.id===CURRENT_WEEK_ID);
  const MAIN_TABS = ["This Week","Shopping","Nutrition","Past Weeks"];
 
  if (loading) return <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:T.textLight, fontSize:13, fontFamily:"'DM Mono',monospace", letterSpacing:"0.08em" }}>Loading…</div>;
  if (error) return <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center" }}><div style={{ textAlign:"center" }}><div style={{ color:T.accent, fontFamily:"'Lora',serif", fontSize:18, marginBottom:8 }}>Something's off</div><div style={{ color:T.textLight, fontSize:11 }}>{error}</div></div></div>;
 
  return (
    <OpenDropCtx.Provider value={{ openKey, setOpenKey }}>
    <SubsCtx.Provider value={{ subs, setSub }}>
    <NutritionDBCtx.Provider value={nutritionDB}>
      <div style={{ minHeight:"100vh", padding:"40px 20px 80px" }}>
        <div style={{ maxWidth:860, margin:"0 auto" }}>
 
          {/* Header */}
          <div style={{ marginBottom:24, borderBottom:`1px solid ${T.divider}`, paddingBottom:24 }}>
            <div style={{ fontSize:10, letterSpacing:"0.2em", textTransform:"uppercase", color:T.textLight, marginBottom:8, fontFamily:"'DM Mono',monospace" }}>Mediterranean · Meal Plan</div>
            <h1 style={{ fontFamily:"'Lora',serif", fontSize:"clamp(2rem,6vw,3.2rem)", fontWeight:400, lineHeight:1.1, color:T.text }}>
              Jake <span style={{ color:T.gold }}>&amp;</span> <span style={{ color:T.accent, fontStyle:"italic" }}>Laine.</span>
            </h1>
            {currentWeek && <div style={{ fontSize:11, color:T.textLight, fontFamily:"'DM Mono',monospace", textTransform:"uppercase", letterSpacing:"0.1em", marginTop:10 }}>{currentWeek.label}</div>}
          </div>
 
          {/* Water Tracker */}
          <WaterTracker/>
 
          {/* Main nav */}
          <div style={{ display:"flex", gap:3, background:"#ede8de", border:`1px solid ${T.border}`, borderRadius:14, padding:4, marginBottom:28, maxWidth:520 }}>
            {MAIN_TABS.map((t,i)=>(
              <button key={t} onClick={()=>setMainTab(i)} style={{ flex:1, padding:"9px 12px", background:mainTab===i?T.card:"none", border:`1px solid ${mainTab===i?T.border:"transparent"}`, borderRadius:10, cursor:"pointer", color:mainTab===i?T.text:T.textLight, fontSize:12, fontWeight:mainTab===i?500:400, transition:"all 0.15s" }}>{t}</button>
            ))}
          </div>
 
          {mainTab===0 && currentWeek && <WeekView week={currentWeek} nutritionDB={nutritionDB}/>}
          {mainTab===1 && currentWeek && <ShoppingTab week={currentWeek}/>}
          {mainTab===2 && currentWeek && <NutritionTab week={currentWeek} nutritionDB={nutritionDB}/>}
          {mainTab===3 && <HistoryTab allWeeks={allWeeks} nutritionDB={nutritionDB}/>}
 
          {/* Footer */}
          <div style={{ marginTop:64, paddingTop:28, borderTop:`1px solid ${T.divider}`, textAlign:"center" }}>
            <div style={{ fontFamily:"'Lora',serif", fontSize:"clamp(1.1rem,3vw,1.4rem)", fontWeight:400, fontStyle:"italic", color:T.textLight, letterSpacing:"0.02em" }}>
              Love you both. <span style={{ color:T.accent }}>♥</span>
            </div>
          </div>
 
        </div>
      </div>
    </NutritionDBCtx.Provider>
    </SubsCtx.Provider>
    </OpenDropCtx.Provider>
  );
}
 
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
