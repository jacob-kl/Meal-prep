<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake & Laine — Meal Plan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f1e; color: #a8c4e0; font-family: system-ui, -apple-system, sans-serif; font-weight: 300; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0d1428; }
  ::-webkit-scrollbar-thumb { background: #2a4a8a; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useContext, createContext, useCallback } = React;

const WEEK_REGISTRY = [
  { id: "2026-W19", label: "Week of May 4, 2026" },
  { id: "2026-W20", label: "Week of May 11, 2026" },
  { id: "2026-W21", label: "Week of May 18, 2026" },
  { id: "2026-W22", label: "Week of May 25, 2026" },
  { id: "2026-W23", label: "Week of June 1, 2026" }
];
const CURRENT_WEEK_ID = WEEK_REGISTRY[WEEK_REGISTRY.length - 1].id;

const UnitsCtx = createContext("imperial");
const useUnits = () => useContext(UnitsCtx);
const SubsCtx = createContext({ subs: {}, setSub: () => {} });
const useSubs = () => useContext(SubsCtx);

const NutritionDBCtx = createContext({});
const useNutritionDB = () => useContext(NutritionDBCtx);

const OpenDropdownCtx = createContext({ openKey: null, setOpenKey: () => {} });
const useOpenDropdown = () => useContext(OpenDropdownCtx);

const CLR = { cal: "#88b4d8", protein: "#c878f8", carbs: "#00d4aa", fat: "#38b6ff", fiber: "#7ec8a0" };

function resolveVal(val, units) {
  if (!val) return "";
  if (typeof val === "string") return val;
  // New qty/unit schema: {qty, unit}
  if (val.qty != null && val.unit != null) return formatQty(val.qty, val.unit, units);
  return val[units] || val.metric || val.imperial || "";
}

// Convert a qty+unit pair into a human-readable string for the given unit system.
// unit values: g_raw, g_dry, g, g_cooked, cup, tbsp, tsp, can, tortilla, container, cup_each, thirds_cup, medium
function formatQty(qty, unit, units) {
  const isUS = units === "imperial";

  // Weight units — convert g to oz/lbs for US
  if (["g_raw","g_dry","g_cooked","g"].includes(unit)) {
    if (isUS) {
      const oz = qty / 28.3495;
      if (oz >= 16) {
        const lbs = oz / 16;
        const rounded = Math.round(lbs * 4) / 4;
        return rounded + " lbs";
      }
      const rounded = Math.round(oz * 4) / 4;
      // Format cleanly: 6.0 → "6", 6.25 → "6¼", etc.
      return fmtOz(rounded) + " oz";
    } else {
      return qty + "g";
    }
  }

  // Volume/count units — same in both systems, just display nicely
  if (unit === "cup")        return fmtFrac(qty) + " cup" + (qty !== 1 ? "s" : "");
  if (unit === "cup_each")   return fmtFrac(qty) + " cup each";
  if (unit === "thirds_cup") return fmtFrac(qty * (1/3)) + " cup";
  if (unit === "tbsp")       return fmtFrac(qty) + " tbsp";
  if (unit === "tsp")        return fmtFrac(qty) + " tsp";
  if (unit === "can")        return qty === 1 ? "1 can" : qty + " cans";
  if (unit === "tortilla")   return qty + " tortilla" + (qty !== 1 ? "s" : "");
  if (unit === "container")  return qty + " container" + (qty !== 1 ? "s" : "");
  if (unit === "medium")     return qty + " medium";
  return String(qty);
}

function fmtOz(oz) {
  const whole = Math.floor(oz);
  const frac = Math.round((oz - whole) * 4);
  const fracStr = ["", "¼", "½", "¾"][frac] || "";
  return whole === 0 ? fracStr : (fracStr ? whole + fracStr : String(whole));
}

function fmtFrac(n) {
  const rounded = Math.round(n * 8) / 8;
  const whole = Math.floor(rounded);
  const frac = Math.round((rounded - whole) * 8);
  const eighths = ["","⅛","¼","⅜","½","⅝","¾","⅞"];
  const fracStr = eighths[frac] || "";
  return whole === 0 ? (fracStr || "0") : (fracStr ? whole + fracStr : String(whole));
}

function resolveIngredient(ing, subs, units) {
  if (!ing.subKey || !subs[ing.subKey]) return ing;
  const sub = ing.substitutions && ing.substitutions.find(s => s.id === subs[ing.subKey]);
  if (!sub) return ing;
  return { ...ing, item: sub.item, jake: sub.jake || ing.jake, laine: sub.laine || ing.laine, shared: sub.shared || ing.shared };
}

function resolveDinner(d, subs) {
  let jake = d.jake, laine = d.laine, steps = d.steps;
  for (const ing of d.ingredients) {
    if (!ing.subKey || !subs[ing.subKey]) continue;
    const sub = ing.substitutions && ing.substitutions.find(s => s.id === subs[ing.subKey]);
    if (!sub) continue;
    if (sub.macros_override) {
      if (sub.macros_override.jake) jake = { ...jake, ...sub.macros_override.jake };
      if (sub.macros_override.laine) laine = { ...laine, ...sub.macros_override.laine };
    }
    if (sub.steps) steps = sub.steps;
  }
  return { jake, laine, steps };
}

function buildShoppingList(week, subs, units) {
  const list = {};
  Object.entries(week.shopping).forEach(([cat, items]) => {
    list[cat] = items.map(item => {
      if (typeof item === "string") return { display: item, key: item };
      if (item.subKey && subs[item.subKey]) {
        const sub = item.substitutions && item.substitutions.find(s => s.id === subs[item.subKey]);
        if (sub) return { display: resolveVal(sub.shopping || sub.item, units), key: item.subKey + "-" + sub.id };
      }
      return { display: resolveVal(item, units), key: resolveVal(item, units) };
    });
  });
  return list;
}

function MacroRow({ macros }) {
  const items = [["cal", macros.cal, "kcal"], ["protein", macros.protein, "g"], ["carbs", macros.carbs, "g"], ["fat", macros.fat, "g"]];
  if (macros.fiber != null) items.push(["fiber", macros.fiber, "g"]);
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "8px 0 14px" }}>
      {items.map(([key, val, unit]) => (
        <span key={key} style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "#0f1a2e", border: "1px solid #1e3d6b", borderRadius: 7, padding: "3px 9px", fontFamily: "monospace", fontSize: 11, color: CLR[key] }}>
          <span style={{ color: "#2a4060", fontSize: 9, textTransform: "uppercase", letterSpacing: 1 }}>{key}</span>{val}{unit}
        </span>
      ))}
    </div>
  );
}

function Card({ title, children }) {
  return (
    <div style={{ background: "#0f1a2e", border: "1px solid #252525", borderRadius: 13, padding: "16px 18px" }}>
      <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#3a5878", marginBottom: 11 }}>{title}</div>
      {children}
    </div>
  );
}

function Steps({ items }) {
  return (
    <ol style={{ paddingLeft: 16, margin: 0, display: "flex", flexDirection: "column", gap: 7 }}>
      {items.map((item, i) => <li key={i} style={{ fontSize: 12, lineHeight: 1.5, color: "#8aaed4" }}>{item}</li>)}
    </ol>
  );
}

function SubDropdown({ ing }) {
  const { subs, setSub } = useSubs();
  const { openKey, setOpenKey } = useOpenDropdown();
  const btnRef = React.useRef(null);
  const isOpen = openKey === ing.subKey;
  const current = subs[ing.subKey] || "default";
  const [menuStyle, setMenuStyle] = useState({});

  const toggle = () => {
    if (!isOpen && btnRef.current) {
      const rect = btnRef.current.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      const menuHeight = Math.min(280, 44 + ing.substitutions.length * 52);
      const top = spaceBelow > menuHeight
        ? rect.bottom + 6
        : rect.top - menuHeight - 6;
      setMenuStyle({ top: Math.max(8, top), left: Math.min(rect.left, window.innerWidth - 220) });
    }
    setOpenKey(isOpen ? null : ing.subKey);
  };

  return (
    <div style={{ display: "inline-block" }}>
      <button ref={btnRef} onClick={toggle} style={{ background: "none", border: "1px solid #1e3d6b", borderRadius: 5, color: "#4a6888", padding: "1px 5px", cursor: "pointer", fontSize: 10, lineHeight: 1, marginLeft: 6 }}>
        swap {isOpen ? "^" : "v"}
      </button>
      {isOpen && (
        <div style={{ position: "fixed", ...menuStyle, zIndex: 1000, background: "#101f38", border: "1px solid #3060a0", borderRadius: 10, padding: 6, width: 210, boxShadow: "0 8px 32px rgba(0,0,30,0.9)" }}>
          <div onClick={() => { setSub(ing.subKey, null); setOpenKey(null); }} style={{ padding: "8px 10px", fontSize: 12, color: current === "default" ? "#00d4aa" : "#8aaed4", cursor: "pointer", borderRadius: 7, background: current === "default" ? "#2a2510" : "none" }}>
            {ing.item} <span style={{ color: "#2a4060", fontSize: 10 }}>(original)</span>
          </div>
          {ing.substitutions.map(sub => (
            <div key={sub.id} onClick={() => { setSub(ing.subKey, sub.id); setOpenKey(null); }} style={{ padding: "8px 10px", fontSize: 12, color: current === sub.id ? "#00d4aa" : "#8aaed4", cursor: "pointer", borderRadius: 7, background: current === sub.id ? "#2a2510" : "none" }}>
              {sub.item}
              {sub.note && <div style={{ fontSize: 10, color: "#3a5878", marginTop: 2 }}>{sub.note}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function IngNutrition({ n, color }) {
  if (!n) return null;
  const pills = [["cal", n.cal, "kcal"], ["pro", n.protein, "g"], ["carb", n.carbs, "g"], ["fat", n.fat, "g"]];
  return (
    <span style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 4 }}>
      {pills.map(([k, v, u]) => (
        <span key={k} style={{ fontSize: 9, fontFamily: "monospace", color: color || "#88b4d8", background: "#0c1524", border: "1px solid #1a2f50", borderRadius: 5, padding: "1px 6px", letterSpacing: "0.02em" }}>
          <span style={{ color: "#2a4060", marginRight: 2 }}>{k}</span>{v}{u}
        </span>
      ))}
    </span>
  );
}

// Compute macros for an ingredient given its qty and the DB entry.
// DB entry has serving_qty + serving_unit + cal/protein/carbs/fat.
// ing has qty + unit (or jake/laine sub-objects with qty+unit).
function calcIngMacros(dbEntry, qty) {
  if (!dbEntry || qty == null) return null;
  const ratio = qty / dbEntry.serving_qty;
  return {
    cal:     Math.round(dbEntry.cal     * ratio),
    protein: Math.round(dbEntry.protein * ratio),
    carbs:   Math.round(dbEntry.carbs   * ratio),
    fat:     Math.round(dbEntry.fat     * ratio),
  };
}

function scaleNutrition(base, ratio) {
  if (!base) return null;
  return { cal: Math.round(base.cal * ratio), protein: Math.round(base.protein * ratio), carbs: Math.round(base.carbs * ratio), fat: Math.round(base.fat * ratio) };
}

function parseQty(s) {
  if (!s || typeof s !== "string") return 1;
  const frac = s.match(/(\d+)\s*\/\s*(\d+)/);
  if (frac) {
    const whole = s.match(/^(\d+)\s+\d+\/\d+/);
    return (whole ? parseInt(whole[1]) : 0) + parseInt(frac[1]) / parseInt(frac[2]);
  }
  const num = s.match(/(\d+\.?\d*)/);
  return num ? parseFloat(num[1]) : 1;
}

function IngredientList({ items, nutritionColor }) {
  const { subs } = useSubs();
  const units = useUnits();
  const db = useNutritionDB();
  return (
    <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 10 }}>
      {items.map((rawIng, i) => {
        const text = typeof rawIng === "string"
          ? rawIng
          : rawIng.item
            ? resolveIngredient(rawIng, subs, units).item
            : rawIng[units] || rawIng.metric || rawIng.imperial || "";
        const hasSubs = rawIng && rawIng.substitutions && rawIng.substitutions.length > 0;
        const base = rawIng.nutritionKey ? db[rawIng.nutritionKey] : null;
        return (
          <li key={i} style={{ paddingLeft: 13, position: "relative" }}>
            <span style={{ position: "absolute", left: 0, top: 2, color: "#00d4aa" }}>-</span>
            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 4 }}>
              <span style={{ fontSize: 12, lineHeight: 1.5, color: "#8aaed4" }}>{text}</span>
              {hasSubs && <SubDropdown ing={rawIng} />}
            </div>
            {base && <IngNutrition n={base} color={nutritionColor} />}
          </li>
        );
      })}
    </ul>
  );
}

function Accordion({ label, labelColor, name, note, macros, ingredients, steps, isOpen, onToggle }) {
  return (
    <div style={{ background: "#0f1a2e", border: "1px solid " + (isOpen ? "#1e3a5f" : "#162d4f"), borderRadius: 14, marginBottom: 10 }}>
      <button onClick={onToggle} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", background: "none", border: "none", cursor: "pointer", color: "inherit" }}>
        <div style={{ textAlign: "left" }}>
          {label && <div style={{ fontSize: 11, color: labelColor || "#00d4aa", fontFamily: "monospace", marginBottom: 4, letterSpacing: "0.06em" }}>{label}</div>}
          <div style={{ fontSize: 15, fontWeight: 400 }}>{name}</div>
          {note && <div style={{ fontSize: 12, color: "#3a5878", marginTop: 2 }}>{note}</div>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0, marginLeft: 12 }}>
          <span style={{ fontSize: 11, color: "#7ec8a0", fontFamily: "monospace" }}>{macros.protein}g P</span>
          <span style={{ color: "#2a4060", fontSize: 13 }}>{isOpen ? "^" : "v"}</span>
        </div>
      </button>
      {isOpen && (
        <div style={{ padding: "0 20px 20px" }}>
          <MacroRow macros={macros} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Card title="Ingredients"><IngredientList items={ingredients} /></Card>
            <Card title="Instructions"><Steps items={steps} /></Card>
          </div>
        </div>
      )}
    </div>
  );
}

function DinnerCard({ d, isOpen, onToggle }) {
  const { subs } = useSubs();
  const units = useUnits();
  const nutritionDB = useNutritionDB();
  const { jake, laine, steps } = resolveDinner(d, subs);
  return (
    <div style={{ background: "#0f1a2e", border: "1px solid " + (isOpen ? "#1e3a5f" : "#162d4f"), borderRadius: 14 }}>
      <button onClick={onToggle} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", background: "none", border: "none", cursor: "pointer", color: "inherit" }}>
        <div style={{ textAlign: "left" }}>
          <div style={{ fontSize: 11, color: "#00d4aa", fontFamily: "monospace", marginBottom: 4 }}>{d.day}</div>
          <div style={{ fontSize: 15, fontWeight: 400, marginBottom: 3 }}>{d.name}</div>
          <div style={{ fontSize: 11, color: "#3a5878" }}>{d.note}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0, marginLeft: 12 }}>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 11, color: "#38b6ff", fontFamily: "monospace" }}>J: {jake.cal} kcal</div>
            <div style={{ fontSize: 11, color: "#c878f8", fontFamily: "monospace" }}>L: {laine.cal} kcal</div>
          </div>
          <span style={{ color: "#2a4060", fontSize: 13 }}>{isOpen ? "^" : "v"}</span>
        </div>
      </button>
      {isOpen && (
        <div style={{ padding: "0 20px 20px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 11, color: "#38b6ff", fontFamily: "monospace", marginBottom: 6, textTransform: "uppercase" }}>Jake</div>
              <MacroRow macros={jake} />
            </div>
            <div>
              <div style={{ fontSize: 11, color: "#c878f8", fontFamily: "monospace", marginBottom: 6, textTransform: "uppercase" }}>Laine</div>
              <MacroRow macros={laine} />
            </div>
          </div>
          <div style={{ background: "#0c1524", border: "1px solid #222", borderRadius: 11, overflow: "visible", marginBottom: 12 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr 1fr", borderBottom: "1px solid #222" }}>
              {["Ingredient", "Jake", "Laine"].map(h => (
                <div key={h} style={{ padding: "8px 12px", fontSize: 9, color: "#2a4060", fontFamily: "monospace", letterSpacing: "0.1em", textTransform: "uppercase" }}>{h}</div>
              ))}
            </div>
            {d.ingredients.map((rawIng, i) => {
              const ing = resolveIngredient(rawIng, subs, units);
              const jakeQtyObj  = ing.jake   ? ing.jake   : ing.shared;
              const laineQtyObj = ing.laine  ? ing.laine  : ing.shared;
              const jakeVal  = jakeQtyObj  ? resolveVal(jakeQtyObj,  units) : "";
              const laineVal = laineQtyObj ? resolveVal(laineQtyObj, units) : "";
              const base = rawIng.nutritionKey ? nutritionDB[rawIng.nutritionKey] : null;
              // Use explicit qty if available, fall back to parseQty ratio
              const jakeN  = (base && jakeQtyObj  && jakeQtyObj.qty  != null) ? calcIngMacros(base, jakeQtyObj.qty)
                           : base ? scaleNutrition(base, 0.5) : null;
              const laineN = (base && laineQtyObj && laineQtyObj.qty != null) ? calcIngMacros(base, laineQtyObj.qty)
                           : base ? scaleNutrition(base, 0.5) : null;
              return (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr 1fr", borderBottom: i < d.ingredients.length - 1 ? "1px solid #1a2f50" : "none", alignItems: "start" }}>
                  <div style={{ padding: "9px 12px", fontSize: 12, color: "#8aaed4", display: "flex", alignItems: "center", flexWrap: "wrap", gap: 4 }}>
                    {ing.item}
                    {rawIng.substitutions && rawIng.substitutions.length > 0 && <SubDropdown ing={rawIng} />}
                  </div>
                  <div style={{ padding: "9px 12px", fontSize: 12, color: "#38b6ff", fontFamily: "monospace" }}>
                    {jakeVal}
                    <IngNutrition n={jakeN} color="#38b6ff" />
                  </div>
                  <div style={{ padding: "9px 12px", fontSize: 12, color: "#c878f8", fontFamily: "monospace" }}>
                    {laineVal}
                    <IngNutrition n={laineN} color="#c878f8" />
                  </div>
                </div>
              );
            })}
          </div>
          <Card title="Instructions"><Steps items={steps} /></Card>
        </div>
      )}
    </div>
  );
}

function UnitsToggle({ units, setUnits }) {
  return (
    <div style={{ display: "flex", gap: 2, background: "#0c1524", border: "1px solid #1a2f50", borderRadius: 8, padding: 3 }}>
      {["imperial", "metric"].map(u => (
        <button key={u} onClick={() => { setUnits(u); localStorage.setItem("mealplan_units", u); }} style={{ padding: "5px 11px", background: units === u ? "#162440" : "none", border: "1px solid " + (units === u ? "#1e3a5f" : "transparent"), borderRadius: 6, cursor: "pointer", color: units === u ? "#88b4d8" : "#3a5878", fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", transition: "all 0.15s" }}>
          {u === "imperial" ? "US" : "Metric"}
        </button>
      ))}
    </div>
  );
}

function DaysSelector({ person, days, setDays, color }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
      <span style={{ fontSize: 11, color: "#3a5878", fontFamily: "monospace", letterSpacing: "0.06em", textTransform: "uppercase" }}>Prepping for</span>
      <div style={{ display: "flex", gap: 3 }}>
        {[1,2,3,4,5].map(n => (
          <button key={n} onClick={() => setDays(n)} style={{ width: 28, height: 28, borderRadius: 7, border: "1px solid " + (days === n ? color : "#3d2c1f"), background: days === n ? color + "22" : "none", color: days === n ? color : "#3a5878", fontSize: 12, cursor: "pointer", fontFamily: "monospace", transition: "all 0.15s" }}>
            {n}
          </button>
        ))}
      </div>
      <span style={{ fontSize: 11, color: "#3a5878" }}>day{days !== 1 ? "s" : ""}</span>
    </div>
  );
}

function ShoppingList({ week, jakeDays, laineDays }) {
  const { subs } = useSubs();
  const units = useUnits();
  const storageKey = "mealplan_shopchecked_" + week.id;
  const [checked, setChecked] = useState(() => {
    try { return JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch { return {}; }
  });
  const toggle = (key) => setChecked(prev => {
    const next = { ...prev, [key]: !prev[key] };
    localStorage.setItem(storageKey, JSON.stringify(next));
    return next;
  });
  const clearAll = () => { setChecked({}); localStorage.removeItem(storageKey); };
  const list = buildShoppingList(week, subs, units);

  // Scale lunch-related shopping items based on days selected
  function scaleText(text, ratio) {
    if (ratio === 1) return text;
    return text.replace(/(\d+\.?\d*)/g, (m, n) => {
      const scaled = parseFloat(n) * ratio;
      const r = Math.round(scaled * 8) / 8;
      if (r === Math.floor(r)) return String(r);
      const whole = Math.floor(r);
      const frac = r - whole;
      const fracs = [[1,8,"1/8"],[1,4,"1/4"],[3,8,"3/8"],[1,2,"1/2"],[5,8,"5/8"],[3,4,"3/4"],[7,8,"7/8"]];
      for (const [n2,d,s] of fracs) {
        if (Math.abs(frac - n2/d) < 0.07) return whole > 0 ? whole + " " + s : s;
      }
      return parseFloat(scaled.toFixed(1)).toString();
    });
  }

  // Keywords that indicate a lunch-prep item
  const jakeLunchKeywords = ["chicken thigh", "red lentil", "black bean", "spinach"];
  const laineLunchKeywords = ["chicken breast", "jasmine rice", "basmati", "chickpea"];

  const scaledList = {};
  Object.entries(list).forEach(([cat, items]) => {
    scaledList[cat] = items.map(({ display, key }) => {
      const lower = display.toLowerCase();
      const isJakeLunch = jakeLunchKeywords.some(k => lower.includes(k));
      const isLaineLunch = laineLunchKeywords.some(k => lower.includes(k));
      if (isJakeLunch && jakeDays !== 5) return { display: scaleText(display, jakeDays / 5), key };
      if (isLaineLunch && laineDays !== 5) return { display: scaleText(display, laineDays / 5), key };
      return { display, key };
    });
  });

  const totalItems = Object.values(scaledList).flat().length;
  const checkedCount = Object.values(checked).filter(Boolean).length;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: "#3a5878" }}>Full household - one grocery run</div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          {checkedCount > 0 && <span style={{ fontSize: 11, color: "#7ec8a0", fontFamily: "monospace" }}>{checkedCount}/{totalItems} done</span>}
          {checkedCount > 0 && <button onClick={clearAll} style={{ background: "none", border: "1px solid #1e3d6b", borderRadius: 7, color: "#3a5878", padding: "4px 10px", cursor: "pointer", fontSize: 11 }}>Clear all</button>}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))", gap: 20 }}>
        {Object.entries(scaledList).map(([cat, items]) => (
          <div key={cat}>
            <div style={{ fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#00d4aa", marginBottom: 10, paddingBottom: 6, borderBottom: "1px solid #1a2f50" }}>{cat}</div>
            <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 4 }}>
              {items.map(({ display, key }) => {
                const done = !!checked[key];
                return (
                  <li key={key} onClick={() => toggle(key)} style={{ fontSize: 12, color: done ? "#2a4060" : "#5a7898", display: "flex", gap: 8, lineHeight: 1.5, cursor: "pointer", alignItems: "flex-start", padding: "3px 0", userSelect: "none" }}>
                    <span style={{ flexShrink: 0, marginTop: 1, width: 16, height: 16, border: "1px solid " + (done ? "#3a6a3a" : "#1e3a5f"), borderRadius: 4, background: done ? "#1a3a1a" : "none", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: "#7ec8a0", transition: "all 0.15s" }}>
                      {done ? "v" : ""}
                    </span>
                    <span style={{ textDecoration: done ? "line-through" : "none", transition: "all 0.15s" }}>{display}</span>
                  </li>
                );
              })}
            </ul>
          </div>
        ))}
      </div>
    </div>
  );
}

function scaleNumber(num, ratio) {
  const scaled = parseFloat(num) * ratio;
  const rounded = Math.round(scaled * 8) / 8;
  if (rounded === Math.floor(rounded)) return String(rounded);
  const fracs = [[1,8,"1/8"],[1,4,"1/4"],[3,8,"3/8"],[1,2,"1/2"],[5,8,"5/8"],[3,4,"3/4"],[7,8,"7/8"]];
  const whole = Math.floor(rounded);
  const frac = rounded - whole;
  for (const [n,d,s] of fracs) {
    if (Math.abs(frac - n/d) < 0.07) return whole > 0 ? whole + " " + s : s;
  }
  return parseFloat(scaled.toFixed(1)).toString();
}

function scaleIngredient(text, days) {
  if (days === 5) return text;
  const ratio = days / 5;
  return text.replace(/(\d+\.?\d*)\s*(lbs?|oz|kg|g|cups?|tbsp|tsp|cans?|handfuls?|cloves?|bunches?|pints?|ml)/gi,
    (match, num, unit) => scaleNumber(num, ratio) + " " + unit
  );
}

function scaleStep(text, days) {
  if (days === 5) return text;
  const ratio = days / 5;
  return text.replace(/(\d+\.?\d*)\s*(lbs?|oz|kg|g|cups?|tbsp|tsp|cans?|handfuls?|ml)/gi,
    (match, num, unit) => scaleNumber(num, ratio) + " " + unit
  );
}

// Convert metric measurements in a string to US imperial
// g -> oz, kg -> lbs, ml -> fl oz. Cups/tbsp/tsp/oz/lbs left untouched.
function convertToImperial(text) {
  if (!text) return text;
  // kg -> lbs
  text = text.replace(/(\d+\.?\d*)\s*kg/gi, (_, n) => {
    const lbs = parseFloat(n) * 2.20462;
    const rounded = Math.round(lbs * 4) / 4;
    return (rounded === Math.floor(rounded) ? String(rounded) : rounded.toFixed(2).replace(/\.?0+$/, "")) + " lbs";
  });
  // ml -> fl oz
  text = text.replace(/(\d+\.?\d*)\s*ml/gi, (_, n) => {
    const floz = parseFloat(n) / 29.5735;
    const rounded = Math.round(floz * 4) / 4;
    return (rounded === Math.floor(rounded) ? String(rounded) : rounded.toFixed(1)) + " fl oz";
  });
  // grams -> oz (skip if inside a word like "mg")
  text = text.replace(/(\d+\.?\d*)\s*g(?![a-zA-Z])/g, (_, n) => {
    const oz = parseFloat(n) / 28.3495;
    const rounded = Math.round(oz * 4) / 4;
    return (rounded === Math.floor(rounded) ? String(rounded) : rounded.toFixed(1)) + " oz";
  });
  return text;
}

function LunchAccordion({ label, labelColor, lunch, days, setDays, personColor, isOpen, onToggle }) {
  const units = useUnits();
  const db = useNutritionDB();
  const scaledIngredients = lunch.ingredients.map(ing => {
    if (typeof ing === "string") {
      const scaled = scaleIngredient(ing, days);
      return units === "imperial" ? convertToImperial(scaled) : scaled;
    }
    let item = ing.item ? scaleIngredient(ing.item, days) : (ing[units] || ing.metric || ing.imperial || "");
    if (units === "imperial") item = convertToImperial(item);
    return { ...ing, item };
  });
  const scaledSteps = lunch.steps.map(s => {
    let stepped = scaleStep(s, days);
    return units === "imperial" ? convertToImperial(stepped) : stepped;
  });
  // Adjust the "divide into N containers" instruction
  const finalSteps = scaledSteps.map(s =>
    s.replace(/5 containers/g, days + " container" + (days !== 1 ? "s" : ""))
     .replace(/5 equal containers/g, days + " equal container" + (days !== 1 ? "s" : ""))
     .replace(/all 5/g, "all " + days)
     .replace(/for all 5/g, "for all " + days)
  );

  return (
    <div style={{ background: "#0f1a2e", border: "1px solid " + (isOpen ? "#2a4060" : "#162d4f"), borderRadius: 14, marginBottom: 10 }}>
      <button onClick={onToggle} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", background: "none", border: "none", cursor: "pointer", color: "inherit" }}>
        <div style={{ textAlign: "left" }}>
          <div style={{ fontSize: 11, color: labelColor, fontFamily: "monospace", marginBottom: 4, letterSpacing: "0.06em" }}>{label}</div>
          <div style={{ fontSize: 15, fontWeight: 400 }}>{lunch.name}</div>
          {lunch.note && <div style={{ fontSize: 12, color: "#3a5878", marginTop: 2 }}>{lunch.note}</div>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0, marginLeft: 12 }}>
          <span style={{ fontSize: 11, color: "#7ec8a0", fontFamily: "monospace" }}>{lunch.macros.protein}g P</span>
          <span style={{ color: "#2a4060", fontSize: 13 }}>{isOpen ? "^" : "v"}</span>
        </div>
      </button>
      {isOpen && (
        <div style={{ padding: "0 20px 20px" }}>
          <DaysSelector days={days} setDays={setDays} color={personColor} />
          {days < 5 && (
            <div style={{ background: "#061420", border: "1px solid #4a3010", borderRadius: 9, padding: "8px 12px", marginBottom: 12, fontSize: 11, color: "#00d4aa", lineHeight: 1.5 }}>
              Scaled to {days} day{days !== 1 ? "s" : ""} — all amounts adjusted automatically.
            </div>
          )}
          <MacroRow macros={lunch.macros} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <div style={{ background: "#0c1524", border: "1px solid #1e3a5f", borderRadius: 13, padding: "16px 18px" }}>
              <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#3a5878", marginBottom: 11 }}>Ingredients — {days} portion{days !== 1 ? "s" : ""}</div>
              <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 10 }}>
                {scaledIngredients.map((ing, rawIdx) => {
                  const displayText = typeof ing === "string" ? ing : ing.item;
                  const rawIng = typeof ing === "string" ? null : ing;
                  const base = rawIng && rawIng.nutritionKey ? db[rawIng.nutritionKey] : null;
                  // Use the original (pre-scale) qty so macros reflect per-container/jar amount
                  const origIng = typeof lunch.ingredients[rawIdx] === "object" ? lunch.ingredients[rawIdx] : null;
                  const origQty = origIng ? origIng.qty : null;
                  const scaledQty = origQty != null ? origQty * (days / 5) : null;
                  const macros = base && scaledQty != null ? calcIngMacros(base, scaledQty) : null;
                  return (
                    <li key={rawIdx} style={{ paddingLeft: 13, position: "relative" }}>
                      <span style={{ position: "absolute", left: 0, top: 2, color: "#00d4aa" }}>-</span>
                      <span style={{ fontSize: 12, lineHeight: 1.5, color: "#8aaed4" }}>{displayText}</span>
                      {macros && <IngNutrition n={macros} color={personColor} />}
                    </li>
                  );
                })}
              </ul>
            </div>
            <div style={{ background: "#0c1524", border: "1px solid #1e3a5f", borderRadius: 13, padding: "16px 18px" }}>
              <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#3a5878", marginBottom: 11 }}>Instructions</div>
              <ol style={{ paddingLeft: 16, margin: 0, display: "flex", flexDirection: "column", gap: 7 }}>
                {finalSteps.map((s, i) => <li key={i} style={{ fontSize: 12, lineHeight: 1.5, color: "#8aaed4" }}>{s}</li>)}
              </ol>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

                  ].map(({ name, m, color, bg, border }) => (
                    <div key={name} style={{ background: bg, border: "1px solid " + border, borderRadius: 12, padding: "12px 14px" }}>
                      <div style={{ fontSize: 11, color, fontFamily: "monospace", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 8 }}>{name}</div>
                      {[["Cal", m.cal, "kcal"], ["Protein", m.protein, "g"], ["Carbs", m.carbs, "g"], ["Fat", m.fat, "g"]].map(([l, v, u]) => (
                        <div key={l} style={{ fontSize: 11, color: "#6688aa", fontFamily: "monospace", marginBottom: 2 }}>{l}: {v}{u}</div>
                      ))}
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div style={{ display: "flex", gap: 4, background: "#0c1524", border: "1px solid #1a2f50", borderRadius: 12, padding: 4, marginBottom: 28, maxWidth: 300 }}>
              {MAIN_TABS.map((t, i) => (
                <button key={t} onClick={() => setMainTab(i)} style={{ flex: 1, padding: "9px 14px", background: mainTab === i ? "#0f1a2e" : "none", border: "1px solid " + (mainTab === i ? "#1a2e50" : "transparent"), borderRadius: 8, cursor: "pointer", color: mainTab === i ? "#88b4d8" : "#3a5878", fontSize: 11, letterSpacing: "0.04em", textTransform: "uppercase", transition: "all 0.15s" }}>{t}</button>
              ))}
            </div>
            {mainTab === 0 && currentWeek && (
              <div>
                <div style={{ fontSize: 13, color: "#00d4aa", fontFamily: "monospace", marginBottom: 20 }}>{currentWeek.label}</div>
                <WeekView week={currentWeek} />
              </div>
            )}
            {mainTab === 1 && <HistoryTab allWeeks={allWeeks} />}
          </div>
        </div>
      </SubsCtx.Provider>
      </OpenDropdownCtx.Provider>
      </NutritionDBCtx.Provider>
    </UnitsCtx.Provider>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
