<!DOCTYPE html><!-- v3 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake & Laine — Meal Plan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f0f; color: #e8e4dc; font-family: system-ui, -apple-system, sans-serif; font-weight: 300; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #141414; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useContext, createContext, useCallback } = React;

// ── WEEK REGISTRY ──────────────────────────────────────────────────────────
const WEEK_REGISTRY = [
  { id: "2026-W19", label: "Week of May 4, 2026" },
];
const CURRENT_WEEK_ID = WEEK_REGISTRY[WEEK_REGISTRY.length - 1].id;

// ── CONTEXTS ───────────────────────────────────────────────────────────────
const UnitsCtx = createContext("imperial");
const useUnits = () => useContext(UnitsCtx);

const SubsCtx = createContext({ subs: {}, setSub: () => {} });
const useSubs = () => useContext(SubsCtx);

// ── COLORS ────────────────────────────────────────────────────────────────
const CLR = { cal: "#e8e4dc", protein: "#e07070", carbs: "#d4924a", fat: "#5ba3d0", fiber: "#7ec8a0" };

// ── HELPERS ────────────────────────────────────────────────────────────────

function resolveVal(val, units) {
  if (!val) return "";
  if (typeof val === "string") return val;
  return val[units] || val.metric || val.imperial || "";
}

// Given an ingredient object + current subs map, return the active ingredient
function resolveIngredient(ing, subs, units) {
  const subKey = ing.subKey;
  if (subKey && subs[subKey]) {
    const chosenSub = ing.substitutions.find(s => s.id === subs[subKey]);
    if (chosenSub) return { ...ing, item: chosenSub.item, jake: chosenSub.jake || ing.jake, laine: chosenSub.laine || ing.laine, shared: chosenSub.shared || ing.shared, _sub: chosenSub };
  }
  return ing;
}

// Given a dinner + active subs, return the effective macros and steps
function resolveDinner(d, subs) {
  let jake = d.jake, laine = d.laine, steps = d.steps;
  for (const ing of d.ingredients) {
    if (ing.subKey && subs[ing.subKey]) {
      const chosenSub = ing.substitutions.find(s => s.id === subs[ing.subKey]);
      if (chosenSub) {
        if (chosenSub.macros_override) { jake = chosenSub.macros_override.jake || jake; laine = chosenSub.macros_override.laine || laine; }
        if (chosenSub.steps) steps = chosenSub.steps;
      }
    }
  }
  return { jake, laine, steps };
}

// Flatten all shopping items from a week, applying substitutions
function buildShoppingList(week, subs, units) {
  const list = {};
  Object.entries(week.shopping).forEach(([cat, items]) => {
    list[cat] = items.map(item => {
      if (typeof item === "string") return { display: item, key: item };
      if (item.subKey && subs[item.subKey]) {
        const sub = item.substitutions && item.substitutions.find(s => s.id === subs[item.subKey]);
        if (sub) {
          const display = resolveVal(sub.shopping || sub.item, units);
          return { display, key: item.subKey + "-" + sub.id };
        }
      }
      return { display: resolveVal(item, units), key: resolveVal(item, units) };
    });
  });
  return list;
}

// ── MACRO ROW ──────────────────────────────────────────────────────────────
function MacroRow({ macros }) {
  const items = [["cal", macros.cal, "kcal"], ["protein", macros.protein, "g"], ["carbs", macros.carbs, "g"], ["fat", macros.fat, "g"]];
  if (macros.fiber != null) items.push(["fiber", macros.fiber, "g"]);
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "8px 0 14px" }}>
      {items.map(([key, val, unit]) => (
        <span key={key} style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "#1e1e1e", border: "1px solid #2a2a2a", borderRadius: 7, padding: "3px 9px", fontFamily: "monospace", fontSize: 11, color: CLR[key] }}>
          <span style={{ color: "#444", fontSize: 9, textTransform: "uppercase", letterSpacing: 1 }}>{key}</span>{val}{unit}
        </span>
      ))}
    </div>
  );
}

// ── CARD ───────────────────────────────────────────────────────────────────
function Card({ title, children }) {
  return (
    <div style={{ background: "#181818", border: "1px solid #252525", borderRadius: 13, padding: "16px 18px" }}>
      <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#555", marginBottom: 11 }}>{title}</div>
      {children}
    </div>
  );
}

// ── STEPS ──────────────────────────────────────────────────────────────────
function Steps({ items }) {
  return (
    <ol style={{ paddingLeft: 16, margin: 0, display: "flex", flexDirection: "column", gap: 7 }}>
      {items.map((item, i) => <li key={i} style={{ fontSize: 12, lineHeight: 1.5, color: "#bbb" }}>{item}</li>)}
    </ol>
  );
}

// ── INGREDIENT LIST (with substitution dropdowns) ─────────────────────────
function SubDropdown({ ing }) {
  const { subs, setSub } = useSubs();
  const units = useUnits();
  const [open, setOpen] = useState(false);
  const current = subs[ing.subKey] || "default";

  return (
    <div style={{ position: "relative", display: "inline-block" }}>
      <button
        onClick={() => setOpen(o => !o)}
        title="Substitutions"
        style={{ background: "none", border: "1px solid #2a2a2a", borderRadius: 5, color: "#666", padding: "1px 5px", cursor: "pointer", fontSize: 10, lineHeight: 1, marginLeft: 6 }}
      >
        swap {open ? "▲" : "▼"}
      </button>
      {open && (
        <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 100, background: "#202020", border: "1px solid #333", borderRadius: 10, padding: 6, minWidth: 180, boxShadow: "0 8px 24px rgba(0,0,0,0.5)" }}>
          <div
            onClick={() => { setSub(ing.subKey, null); setOpen(false); }}
            style={{ padding: "7px 10px", fontSize: 12, color: current === "default" ? "#c8b87a" : "#bbb", cursor: "pointer", borderRadius: 7, background: current === "default" ? "#2a2510" : "none" }}
          >
            {ing.item} <span style={{ color: "#444", fontSize: 10 }}>(original)</span>
          </div>
          {ing.substitutions.map(sub => (
            <div
              key={sub.id}
              onClick={() => { setSub(ing.subKey, sub.id); setOpen(false); }}
              style={{ padding: "7px 10px", fontSize: 12, color: current === sub.id ? "#c8b87a" : "#bbb", cursor: "pointer", borderRadius: 7, background: current === sub.id ? "#2a2510" : "none" }}
            >
              {sub.item}
              {sub.note && <div style={{ fontSize: 10, color: "#555", marginTop: 2 }}>{sub.note}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function IngredientList({ items }) {
  const { subs } = useSubs();
  const units = useUnits();
  return (
    <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 7 }}>
      {items.map((rawIng, i) => {
        if (typeof rawIng === "string") {
          return (
            <li key={i} style={{ fontSize: 12, lineHeight: 1.5, color: "#bbb", paddingLeft: 13, position: "relative" }}>
              <span style={{ position: "absolute", left: 0, color: "#c8b87a" }}>{"—"}</span>
              {rawIng}
            </li>
          );
        }
        if (!rawIng.item) {
          const display = rawIng[units] || rawIng.metric || rawIng.imperial || "";
          return (
            <li key={i} style={{ fontSize: 12, lineHeight: 1.5, color: "#bbb", paddingLeft: 13, position: "relative" }}>
              <span style={{ position: "absolute", left: 0, color: "#c8b87a" }}>{"—"}</span>
              {display}
            </li>
          );
        }
        const ing = resolveIngredient(rawIng, subs, units);
        return (
          <li key={i} style={{ fontSize: 12, lineHeight: 1.5, color: "#bbb", paddingLeft: 13, position: "relative", display: "flex", alignItems: "center", flexWrap: "wrap", gap: 2 }}>
            <span style={{ position: "absolute", left: 0, color: "#c8b87a" }}>{"—"}</span>
            <span>{ing.item}</span>
            {rawIng.substitutions && rawIng.substitutions.length > 0 && <SubDropdown ing={rawIng} />}
          </li>
        );
      })}
    </ul>
  );
}

// ── ACCORDION ──────────────────────────────────────────────────────────────
function Accordion({ label, labelColor, name, note, macros, ingredients, steps, isOpen, onToggle }) {
  return (
    <div style={{ background: "#181818", border: "1px solid " + (isOpen ? "#333" : "#222"), borderRadius: 14, overflow: "hidden", marginBottom: 10 }}>
      <button onClick={onToggle} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", background: "none", border: "none", cursor: "pointer", color: "inherit" }}>
        <div style={{ textAlign: "left" }}>
          {label && <div style={{ fontSize: 11, color: labelColor || "#c8b87a", fontFamily: "monospace", marginBottom: 4, letterSpacing: "0.06em" }}>{label}</div>}
          <div style={{ fontSize: 15, fontWeight: 400 }}>{name}</div>
          {note && <div style={{ fontSize: 12, color: "#555", marginTop: 2 }}>{note}</div>}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0, marginLeft: 12 }}>
          <span style={{ fontSize: 11, color: "#7ec8a0", fontFamily: "monospace" }}>{macros.protein}g P</span>
          <span style={{ color: "#444", fontSize: 13 }}>{isOpen ? "▲" : "▼"}</span>
        </div>
      </button>
      {isOpen && (
        <div style={{ padding: "0 20px 20px" }}>
          <MacroRow macros={macros} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Card title="Ingredients"><IngredientList items={ingredients} /></Card>
            <Card title="Instructions"><Steps items={steps} /></Card>
          </div>
        </div>
      )}
    </div>
  );
}

// ── DINNER CARD ────────────────────────────────────────────────────────────
function DinnerCard({ d, isOpen, onToggle }) {
  const { subs } = useSubs();
  const units = useUnits();
  const { jake, laine, steps } = resolveDinner(d, subs);

  return (
    <div style={{ background: "#181818", border: "1px solid " + (isOpen ? "#333" : "#222"), borderRadius: 14, overflow: "hidden" }}>
      <button onClick={onToggle} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", background: "none", border: "none", cursor: "pointer", color: "inherit" }}>
        <div style={{ textAlign: "left" }}>
          <div style={{ fontSize: 11, color: "#c8b87a", fontFamily: "monospace", marginBottom: 4 }}>{d.day}</div>
          <div style={{ fontSize: 15, fontWeight: 400, marginBottom: 3 }}>{d.name}</div>
          <div style={{ fontSize: 11, color: "#555" }}>{d.note}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0, marginLeft: 12 }}>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 11, color: "#5ba3d0", fontFamily: "monospace" }}>J: {jake.cal} kcal</div>
            <div style={{ fontSize: 11, color: "#e07070", fontFamily: "monospace" }}>L: {laine.cal} kcal</div>
          </div>
          <span style={{ color: "#444", fontSize: 13 }}>{isOpen ? "▲" : "▼"}</span>
        </div>
      </button>
      {isOpen && (
        <div style={{ padding: "0 20px 20px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 11, color: "#5ba3d0", fontFamily: "monospace", marginBottom: 6, textTransform: "uppercase" }}>Jake</div>
              <MacroRow macros={jake} />
            </div>
            <div>
              <div style={{ fontSize: 11, color: "#e07070", fontFamily: "monospace", marginBottom: 6, textTransform: "uppercase" }}>Laine</div>
              <MacroRow macros={laine} />
            </div>
          </div>

          <div style={{ background: "#141414", border: "1px solid #222", borderRadius: 11, overflow: "hidden", marginBottom: 12 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr 1fr", borderBottom: "1px solid #222" }}>
              {["Ingredient", "Jake", "Laine"].map(h => (
                <div key={h} style={{ padding: "8px 12px", fontSize: 9, color: "#444", fontFamily: "monospace", letterSpacing: "0.1em", textTransform: "uppercase" }}>{h}</div>
              ))}
            </div>
            {d.ingredients.map((rawIng, i) => {
              const ing = resolveIngredient(rawIng, subs, units);
              const jakeVal = ing.jake ? resolveVal(ing.jake, units) : resolveVal(ing.shared, units);
              const laineVal = ing.laine ? resolveVal(ing.laine, units) : resolveVal(ing.shared, units);
              return (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr 1fr", borderBottom: i < d.ingredients.length - 1 ? "1px solid #1e1e1e" : "none", alignItems: "center" }}>
                  <div style={{ padding: "8px 12px", fontSize: 12, color: "#bbb", display: "flex", alignItems: "center", flexWrap: "wrap", gap: 4 }}>
                    {ing.item}
                    {rawIng.substitutions && rawIng.substitutions.length > 0 && <SubDropdown ing={rawIng} />}
                  </div>
                  <div style={{ padding: "8px 12px", fontSize: 12, color: "#5ba3d0", fontFamily: "monospace" }}>{jakeVal}</div>
                  <div style={{ padding: "8px 12px", fontSize: 12, color: "#e07070", fontFamily: "monospace" }}>{laineVal}</div>
                </div>
              );
            })}
          </div>

          <Card title="Instructions"><Steps items={steps} /></Card>
        </div>
      )}
    </div>
  );
}

// ── UNITS TOGGLE ───────────────────────────────────────────────────────────
function UnitsToggle({ units, setUnits }) {
  return (
    <div style={{ display: "flex", gap: 2, background: "#141414", border: "1px solid #1e1e1e", borderRadius: 8, padding: 3 }}>
      {["imperial", "metric"].map(u => (
        <button key={u} onClick={() => { setUnits(u); localStorage.setItem("mealplan_units", u); }}
          style={{ padding: "5px 11px", background: units === u ? "#2a2a2a" : "none", border: "1px solid " + (units === u ? "#333" : "transparent"), borderRadius: 6, cursor: "pointer", color: units === u ? "#e8e4dc" : "#555", fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", transition: "all 0.15s" }}>
          {u === "imperial" ? "🇺🇸 US" : "🌍 Metric"}
        </button>
      ))}
    </div>
  );
}

// ── SHOPPING LIST (with checkboxes) ────────────────────────────────────────
function ShoppingList({ week }) {
  const { subs } = useSubs();
  const units = useUnits();
  const storageKey = "mealplan_shopchecked_" + week.id;
  const [checked, setChecked] = useState(() => {
    try { return JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch { return {}; }
  });

  const toggle = (key) => {
    setChecked(prev => {
      const next = { ...prev, [key]: !prev[key] };
      localStorage.setItem(storageKey, JSON.stringify(next));
      return next;
    });
  };

  const clearAll = () => {
    setChecked({});
    localStorage.removeItem(storageKey);
  };

  const list = buildShoppingList(week, subs, units);
  const totalItems = Object.values(list).flat().length;
  const checkedCount = Object.values(checked).filter(Boolean).length;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: "#555" }}>
          Full household — one grocery run
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          {checkedCount > 0 && (
            <span style={{ fontSize: 11, color: "#7ec8a0", fontFamily: "monospace" }}>{checkedCount}/{totalItems} done</span>
          )}
          {checkedCount > 0 && (
            <button onClick={clearAll} style={{ background: "none", border: "1px solid #2a2a2a", borderRadius: 7, color: "#555", padding: "4px 10px", cursor: "pointer", fontSize: 11 }}>
              Clear all
            </button>
          )}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))", gap: 20 }}>
        {Object.entries(list).map(([cat, items]) => (
          <div key={cat}>
            <div style={{ fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#c8b87a", marginBottom: 10, paddingBottom: 6, borderBottom: "1px solid #1e1e1e" }}>{cat}</div>
            <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 4 }}>
              {items.map(({ display, key }) => {
                const done = !!checked[key];
                return (
                  <li key={key} onClick={() => toggle(key)} style={{ fontSize: 12, color: done ? "#444" : "#999", display: "flex", gap: 8, lineHeight: 1.5, cursor: "pointer", alignItems: "flex-start", padding: "3px 0", userSelect: "none" }}>
                    <span style={{ flexShrink: 0, marginTop: 1, width: 16, height: 16, border: "1px solid " + (done ? "#3a6a3a" : "#333"), borderRadius: 4, background: done ? "#1a3a1a" : "none", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: "#7ec8a0", transition: "all 0.15s" }}>
                      {done ? "✓" : ""}
                    </span>
                    <span style={{ textDecoration: done ? "line-through" : "none", transition: "all 0.15s" }}>{display}</span>
                  </li>
                );
              })}
            </ul>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── WEEK VIEW ──────────────────────────────────────────────────────────────
function WeekView({ week }) {
  const [tab, setTab] = useState(0);
  const [openDinner, setOpenDinner] = useState(null);
  const [openLunch, setOpenLunch] = useState(null);
  const [openBreakfast, setOpenBreakfast] = useState(null);
  const TABS = ["Lunch Prep", "Dinners", "Laine's Breakfasts", "Jake's Snacks", "Shopping", "Targets"];

  return (
    <div>
      <div style={{ display: "flex", gap: 3, flexWrap: "wrap", background: "#141414", border: "1px solid #1e1e1e", borderRadius: 12, padding: 4, marginBottom: 28 }}>
        {TABS.map((t, i) => (
          <button key={t} onClick={() => setTab(i)} style={{ flex: 1, minWidth: 90, padding: "8px 10px", background: tab === i ? "#1e1e1e" : "none", border: "1px solid " + (tab === i ? "#2e2e2e" : "transparent"), borderRadius: 8, cursor: "pointer", color: tab === i ? "#e8e4dc" : "#555", fontSize: 10, letterSpacing: "0.04em", textTransform: "uppercase", transition: "all 0.15s" }}>{t}</button>
        ))}
      </div>

      {tab === 0 && (
        <div>
          <div style={{ background: "#1a1508", border: "1px solid #332e18", borderRadius: 12, padding: "12px 16px", marginBottom: 20, fontSize: 12, color: "#c8b87a", lineHeight: 1.6 }}>
            Make the full batch in one go on Sunday, then divide evenly into 5 containers. Both lunches keep in the fridge all week.
          </div>
          <Accordion label="Jake" labelColor="#5ba3d0" name={week.jakeLunch.name} note={week.jakeLunch.note} macros={week.jakeLunch.macros} ingredients={week.jakeLunch.ingredients} steps={week.jakeLunch.steps} isOpen={openLunch === 0} onToggle={() => setOpenLunch(openLunch === 0 ? null : 0)} />
          <Accordion label="Laine" labelColor="#e07070" name={week.laineLunch.name} note={week.laineLunch.note} macros={week.laineLunch.macros} ingredients={week.laineLunch.ingredients} steps={week.laineLunch.steps} isOpen={openLunch === 1} onToggle={() => setOpenLunch(openLunch === 1 ? null : 1)} />
        </div>
      )}

      {tab === 1 && (
        <div>
          <div style={{ fontSize: 13, color: "#666", marginBottom: 20, lineHeight: 1.6 }}>Every dinner cooked together. Same recipe, different portions. Tap an ingredient's <span style={{ color: "#666", fontFamily: "monospace", fontSize: 11 }}>swap</span> button to substitute — it updates the shopping list too.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {week.dinners.map((d, i) => (
              <DinnerCard key={d.day} d={d} isOpen={openDinner === i} onToggle={() => setOpenDinner(openDinner === i ? null : i)} />
            ))}
          </div>
        </div>
      )}

      {tab === 2 && (
        <div>
          <div style={{ fontSize: 13, color: "#666", marginBottom: 24, lineHeight: 1.6 }}>Laine only — Jake has coffee.</div>
          {week.laineBreakfasts.map((b, i) => (
            <Accordion key={b.name} label={b.day} labelColor="#e07070" name={b.name} macros={b.macros} ingredients={b.ingredients} steps={b.steps} isOpen={openBreakfast === i} onToggle={() => setOpenBreakfast(openBreakfast === i ? null : i)} />
          ))}
        </div>
      )}

      {tab === 3 && (
        <div>
          <div style={{ fontSize: 13, color: "#666", marginBottom: 24, lineHeight: 1.6 }}>Jake only — pick 1-2 per day.</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {week.jakeSnacks.map(s => (
              <div key={s.name} style={{ background: "#181818", border: "1px solid #252525", borderRadius: 14, padding: "18px 20px" }}>
                <div style={{ fontSize: 15, fontWeight: 400, marginBottom: 6 }}>{s.name}</div>
                <div style={{ fontSize: 13, color: "#777", lineHeight: 1.6, marginBottom: 12 }}>{s.desc}</div>
                <MacroRow macros={s.macros} />
              </div>
            ))}
          </div>
        </div>
      )}

      {tab === 4 && <ShoppingList week={week} />}

      {tab === 5 && (
        <div>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: "#555", marginBottom: 24 }}>Daily targets vs estimated intake</div>
          {[
            { person: "Jake",  color: "#5ba3d0", border: "#1a3a52", rows: week.targets.jake.rows,  total: week.targets.jake.total,  goal: week.targets.jake.goal },
            { person: "Laine", color: "#e07070", border: "#3d1a1a", rows: week.targets.laine.rows, total: week.targets.laine.total, goal: week.targets.laine.goal },
          ].map(({ person, color, border, rows, total, goal }) => (
            <div key={person} style={{ marginBottom: 28 }}>
              <div style={{ fontSize: 13, color, fontFamily: "monospace", textTransform: "uppercase", marginBottom: 12 }}>{person}</div>
              <div style={{ background: "#181818", border: "1px solid " + border, borderRadius: 13, overflow: "hidden" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead>
                    <tr style={{ borderBottom: "1px solid #222" }}>
                      {["Meal", "Cal", "Protein", "Carbs", "Fat", "Fiber"].map(h => (
                        <th key={h} style={{ textAlign: "left", padding: "10px 14px", color: "#444", fontWeight: 400, fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase", fontFamily: "monospace" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map(([meal, cal, pro, carb, fat, fiber]) => (
                      <tr key={meal} style={{ borderBottom: "1px solid #1e1e1e" }}>
                        <td style={{ padding: "11px 14px", color: "#ccc" }}>{meal}</td>
                        <td style={{ padding: "11px 14px", color: "#e8e4dc", fontFamily: "monospace" }}>{cal}</td>
                        <td style={{ padding: "11px 14px", color: "#e07070", fontFamily: "monospace" }}>{pro}g</td>
                        <td style={{ padding: "11px 14px", color: "#d4924a", fontFamily: "monospace" }}>{carb}g</td>
                        <td style={{ padding: "11px 14px", color: "#5ba3d0", fontFamily: "monospace" }}>{fat}g</td>
                        <td style={{ padding: "11px 14px", color: "#7ec8a0", fontFamily: "monospace" }}>{fiber}g</td>
                      </tr>
                    ))}
                    <tr style={{ background: "#1e1e1e", borderTop: "1px solid #333" }}>
                      <td style={{ padding: "12px 14px", color, fontFamily: "monospace" }}>Total</td>
                      {total.map((v, i) => <td key={i} style={{ padding: "12px 14px", color, fontFamily: "monospace" }}>~{v}{i > 0 ? "g" : ""}</td>)}
                    </tr>
                    <tr>
                      <td style={{ padding: "10px 14px", color: "#444", fontFamily: "monospace" }}>Goal</td>
                      {goal.map((v, i) => <td key={i} style={{ padding: "10px 14px", color: "#444", fontFamily: "monospace" }}>{v}{i > 0 ? "g" : ""}</td>)}
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── HISTORY TAB ────────────────────────────────────────────────────────────
function HistoryTab({ allWeeks }) {
  const [viewing, setViewing] = useState(null);
  const past = allWeeks.filter(w => w.id !== CURRENT_WEEK_ID).reverse();

  if (viewing) {
    return (
      <div>
        <button onClick={() => setViewing(null)} style={{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "1px solid #2a2a2a", borderRadius: 8, color: "#888", padding: "7px 14px", cursor: "pointer", fontSize: 12, marginBottom: 24 }}>
          ← Back to history
        </button>
        <div style={{ fontSize: 11, color: "#c8b87a", fontFamily: "monospace", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 20 }}>{viewing.label}</div>
        <WeekView week={viewing} />
      </div>
    );
  }

  if (past.length === 0) {
    return (
      <div style={{ textAlign: "center", padding: "60px 0", color: "#444" }}>
        <div style={{ fontSize: 32, marginBottom: 12 }}>📋</div>
        <div style={{ fontSize: 14 }}>No past weeks yet.</div>
        <div style={{ fontSize: 12, marginTop: 6, color: "#333" }}>Past weeks appear here as you add new JSON files.</div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: "#555", marginBottom: 20 }}>{past.length} past week{past.length !== 1 ? "s" : ""}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {past.map(week => (
          <div key={week.id} style={{ background: "#181818", border: "1px solid #252525", borderRadius: 14, padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 400, marginBottom: 4 }}>{week.label}</div>
              <div style={{ fontSize: 11, color: "#444", fontFamily: "monospace" }}>{week.dinners.length} dinners</div>
            </div>
            <button onClick={() => setViewing(week)} style={{ background: "#1e1e1e", border: "1px solid #2e2e2e", borderRadius: 8, color: "#c8b87a", padding: "7px 14px", cursor: "pointer", fontSize: 12 }}>View</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────────────
function App() {
  const [mainTab, setMainTab] = useState(0);
  const [allWeeks, setAllWeeks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [units, setUnits] = useState(() => localStorage.getItem("mealplan_units") || "imperial");
  const [subs, setSubs] = useState(() => {
    try { return JSON.parse(localStorage.getItem("mealplan_subs") || "{}"); } catch { return {}; }
  });

  const setSub = useCallback((key, val) => {
    setSubs(prev => {
      const next = { ...prev };
      if (val == null) delete next[key]; else next[key] = val;
      localStorage.setItem("mealplan_subs", JSON.stringify(next));
      return next;
    });
  }, []);

  useEffect(() => {
    async function loadWeeks() {
      try {
        const results = await Promise.all(
          WEEK_REGISTRY.map(async ({ id, label }) => {
            const res = await fetch("weeks/" + id + ".json");
            if (!res.ok) throw new Error("Could not load " + id + ".json");
            const data = await res.json();
            return { ...data, id, label };
          })
        );
        setAllWeeks(results);
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    }
    loadWeeks();
  }, []);

  const currentWeek = allWeeks.find(w => w.id === CURRENT_WEEK_ID);
  const MAIN_TABS = ["This Week", "Past Weeks"];

  if (loading) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "#444", fontSize: 13, fontFamily: "monospace" }}>Loading...</div>;
  if (error) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ textAlign: "center", color: "#e07070", fontFamily: "monospace", fontSize: 13 }}>
        <div style={{ marginBottom: 8 }}>Error loading week data</div>
        <div style={{ color: "#555", fontSize: 11 }}>{error}</div>
      </div>
    </div>
  );

  return (
    <UnitsCtx.Provider value={units}>
      <SubsCtx.Provider value={{ subs, setSub }}>
        <div style={{ minHeight: "100vh", padding: "40px 20px 80px" }}>
          <div style={{ maxWidth: 900, margin: "0 auto" }}>

            <div style={{ marginBottom: 36, borderBottom: "1px solid #1e1e1e", paddingBottom: 28 }}>
              <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", flexWrap: "wrap", gap: 12, marginBottom: 16 }}>
                <div>
                  <div style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "#c8b87a", marginBottom: 10 }}>Household Meal Plan</div>
                  <h1 style={{ fontSize: "clamp(1.8rem, 5vw, 2.8rem)", fontWeight: 300, lineHeight: 1.1, letterSpacing: "-0.02em" }}>
                    Jake <span style={{ color: "#333" }}>&amp;</span> <span style={{ color: "#c8b87a", fontStyle: "italic" }}>Laine.</span>
                  </h1>
                </div>
                <UnitsToggle units={units} setUnits={setUnits} />
              </div>
              {currentWeek && (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, maxWidth: 480 }}>
                  {[
                    { name: "Jake",  m: currentWeek.jakeMacros,  color: "#5ba3d0", bg: "#0d1a26", border: "#1a3a52" },
                    { name: "Laine", m: currentWeek.laineMacros, color: "#e07070", bg: "#261515", border: "#3d1a1a" },
                  ].map(({ name, m, color, bg, border }) => (
                    <div key={name} style={{ background: bg, border: "1px solid " + border, borderRadius: 12, padding: "12px 14px" }}>
                      <div style={{ fontSize: 11, color, fontFamily: "monospace", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 8 }}>{name}</div>
                      {[["Cal", m.cal, "kcal"], ["Protein", m.protein, "g"], ["Carbs", m.carbs, "g"], ["Fat", m.fat, "g"]].map(([l, v, u]) => (
                        <div key={l} style={{ fontSize: 11, color: "#aaa", fontFamily: "monospace", marginBottom: 2 }}>{l}: {v}{u}</div>
                      ))}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ display: "flex", gap: 4, background: "#141414", border: "1px solid #1e1e1e", borderRadius: 12, padding: 4, marginBottom: 28, maxWidth: 300 }}>
              {MAIN_TABS.map((t, i) => (
                <button key={t} onClick={() => setMainTab(i)} style={{ flex: 1, padding: "9px 14px", background: mainTab === i ? "#1e1e1e" : "none", border: "1px solid " + (mainTab === i ? "#2e2e2e" : "transparent"), borderRadius: 8, cursor: "pointer", color: mainTab === i ? "#e8e4dc" : "#555", fontSize: 11, letterSpacing: "0.04em", textTransform: "uppercase", transition: "all 0.15s" }}>{t}</button>
              ))}
            </div>

            {mainTab === 0 && currentWeek && (
              <div>
                <div style={{ fontSize: 13, color: "#c8b87a", fontFamily: "monospace", marginBottom: 20 }}>{currentWeek.label}</div>
                <WeekView week={currentWeek} />
              </div>
            )}
            {mainTab === 1 && <HistoryTab allWeeks={allWeeks} />}

          </div>
        </div>
      </SubsCtx.Provider>
    </UnitsCtx.Provider>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
